<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1 Rose, Every Language</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Georgia', 'Times New Roman', serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        h1 {
            color: #ff3344;
            font-size: 2.2rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 51, 68, 0.5);
            animation: pulse 2s infinite;
            text-align: center;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        #canvas-container {
            position: relative;
            width: 500px;
            height: 550px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .word {
            position: absolute;
            font-size: 11px;
            white-space: nowrap;
            transition: all 0.5s ease-in-out;
            user-select: none;
            opacity: 0;
            animation: fadeIn 0.8s forwards;
        }

        @keyframes fadeIn {
            to { opacity: 0.85; }
        }

        .red { color: #ff2244; text-shadow: 0 0 5px rgba(255, 34, 68, 0.4); }
        .green { color: #2ecc71; text-shadow: 0 0 5px rgba(46, 204, 113, 0.4); }
    </style>
</head>
<body>

    <h1>1 Rose, Every Language</h1>
    <div id="canvas-container"></div>

    <script>
        const phrases = [
            "I LOVE YOU", "Te amo", "Je t'aime", "Ich liebe dich", "Te quiero",
            "أحبك", "Mahal kita", "Nakapenda", "S'agapo", "Milujem ťa",
            "Kocham Cię", "Seni seviyorum", "Я тебя люблю", "사랑해요", "我爱你",
            "Ti amo", "Jeg elsker dig", "Minä rakastan sinua", "Volim te"
        ];

        const container = document.getElementById('canvas-container');
        const totalElements = 180;

        for (let i = 0; i < totalElements; i++) {
            const el = document.createElement('div');
            el.classList.add('word');
            el.innerText = phrases[Math.floor(Math.random() * phrases.length)];

            let x = 0, y = 0;
            let isRed = true;

            if (i < 140) {
                // رأس الوردة: 8 بتلات منظمة باستخدام معادلة وردية (Rose Curve)
                isRed = true;
                const petalCount = 8;
                // توجيه الزاوية لتوزيع الكلمات على 8 بتلات متساوية
                const theta = (i / 140) * Math.PI * 2 * 3; 
                const r = 90 * Math.sin(petalCount * theta / 6); // نصف القطر يعطي شكل 8 بتلات
                
                // توزيع عشوائي طفيف داخل مساحة البتلة لتبدو طبيعية
                const randSpread = 0.7 + Math.random() * 0.5;
                const angle = (i / 140) * Math.PI * 2;
                
                x = Math.cos(angle) * Math.abs(r) * randSpread;
                y = Math.sin(angle) * Math.abs(r) * randSpread - 50; // رفعها للأعلى قليلاً
            } else {
                // الجذور والساق الخضراء في الأسفل
                isRed = false;
                const stemIndex = i - 140;
                y = stemIndex * 3 + 40; // تمتد للأسفل بانتظام
                
                // انحناءة واقعية للساق وتفريعات الجذور في الأسفل
                if (stemIndex < 30) {
                    x = Math.sin(stemIndex * 0.2) * 8; // الساق مستقيم ومنحني قليلاً
                } else {
                    // تفريع الجذور يميناً ويساراً في القاعدة
                    const branchDir = (stemIndex % 2 === 0) ? 1 : -1;
                    x = branchDir * (stemIndex - 25) * 1.5 + Math.sin(stemIndex) * 5;
                    y += 10;
                }
            }

            el.classList.add(isRed ? 'red' : 'green');
            el.style.left = `calc(50% + ${x}px)`;
            el.style.top = `calc(50% + ${y}px)`;
            
            // تأخير ظهور تدريجي لكل كلمة
            el.style.animationDelay = `${i * 0.02}s`;
            container.appendChild(el);
        }
    </script>
</body>
</html>
