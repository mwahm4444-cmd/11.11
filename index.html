<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1 Rose, Every Language</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #050203;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

h1 {
    color: #ff2a55;
    font-size: clamp(20px, 5vw, 28px);
    letter-spacing: 2px;
    text-align: center;
    text-shadow: 0 0 15px rgba(255, 42, 85, 0.6);
    margin: 0 0 15px;
    font-weight: 300;
}

#canvas {
    position: relative;
    width: 400px;
    height: 580px;
}

.word {
    position: absolute;
    white-space: nowrap;
    transform: translate(-50%, -50%);
    font-size: 10px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    line-height: 1;
    user-select: none;
}

.red {
    color: #ff2a5a;
    text-shadow: 0 0 6px rgba(255, 42, 90, 0.7);
}

.dark-red {
    color: #c9183b;
    text-shadow: 0 0 4px rgba(201, 24, 59, 0.5);
}

.green {
    color: #10d876;
    text-shadow: 0 0 5px rgba(16, 216, 118, 0.6);
}

.dark-green {
    color: #0b9651;
    text-shadow: 0 0 4px rgba(11, 150, 81, 0.4);
}
</style>
</head>

<body>

<h1>1 Rose, Every Language</h1>
<div id="canvas"></div>

<script>
const phrases = [
    "I LOVE YOU",
    "Te amo",
    "Je t'aime",
    "Ich liebe dich",
    "Te quiero",
    "أحبك",
    "Mahal kita",
    "Nakapenda",
    "S'agapo",
    "Milujem ťa",
    "Kocham Cię",
    "Seni seviyorum",
    "Я тебя люблю",
    "사랑해요",
    "我爱你",
    "Ti amo",
    "Eu te amo"
];

const canvas = document.getElementById("canvas");

// مركز زهرة الوردة
const CX = 200;
const CY = 180;

const sequence = [];

function addWord(x, y, colorClass, customPhrase = null) {
    const el = document.createElement("div");

    el.className = "word " + colorClass;
    el.textContent = customPhrase || phrases[Math.floor(Math.random() * phrases.length)];

    el.style.left = x.toFixed(1) + "px";
    el.style.top = y.toFixed(1) + "px";

    sequence.push(el);
}

// =====================================
// 1. STEM - الساق
// =====================================
function buildStem() {
    const points = 55;
    for (let i = 0; i < points; i++) {
        const t = i / points;
        // منحنى ناعم وانسيابي للساق
        const x = CX + Math.sin(t * Math.PI * 1.5) * 12 - (t * 8);
        const y = CY + 80 + (t * 260);
        addWord(x, y, i % 2 === 0 ? "green" : "dark-green");
    }
}

// =====================================
// 2. LEAVES - الأوراق
// =====================================
function buildLeaf(startX, startY, side) {
    const leafLength = 45;
    const leafWidth = 22;
    
    // رسم شكل ورقة الشجر عبر منحنيين متقابلين
    for (let i = 0; i <= 25; i++) {
        const t = i / 25;
        const width = Math.sin(t * Math.PI) * leafWidth;
        
        // الجزء العلوي من الورقة
        const x1 = startX + side * (t * leafLength);
        const y1 = startY + (t * 15) - width;
        
        // الجزء السفلي من الورقة
        const x2 = startX + side * (t * leafLength);
        const y2 = startY + (t * 15) + width;

        addWord(x1, y1, "green");
        if (i % 2 === 0) addWord(x2, y2, "dark-green");
    }
}

// =====================================
// 3. ROSE BUD & PETALS - بتلات الوردة
// =====================================
function buildRose() {
    // أ) مركز الوردة الداخلي (الحلزوني)
    const innerPoints = 40;
    for (let i = 0; i < innerPoints; i++) {
        const angle = i * 0.4;
        const radius = 2 + (i * 0.8);
        const x = CX + Math.cos(angle) * radius;
        const y = CY + Math.sin(angle) * (radius * 0.85);
        addWord(x, y, "red");
    }

    // ب) الطبقات الوسطى والفيصلية للبتلات
    const petalLayers = [
        { count: 5, radiusX: 28, radiusY: 24, rotationOffset: 0 },
        { count: 6, radiusX: 48, radiusY: 40, rotationOffset: 0.5 },
        { count: 7, radiusX: 72, radiusY: 60, rotationOffset: 0.2 },
        { count: 8, radiusX: 95, radiusY: 80, rotationOffset: 0.7 }
    ];

    petalLayers.forEach((layer, layerIndex) => {
        const numPetals = layer.count;
        for (let p = 0; p < numPetals; p++) {
            const petalAngle = (p / numPetals) * Math.PI * 2 + layer.rotationOffset;
            
            // رسم قوس كل بتلة
            const arcSteps = 14;
            for (let a = 0; a < arcSteps; a++) {
                const stepAngle = petalAngle + ((a / arcSteps) - 0.5) * 1.1;
                const rX = layer.radiusX;
                const rY = layer.radiusY;

                const x = CX + Math.cos(stepAngle) * rX;
                // إمالة خفيفة لجعل شكل زهرة الوردة واقعياً
                const y = CY + Math.sin(stepAngle) * rY - (Math.cos(stepAngle) * 8);

                const color = (layerIndex % 2 === 0) ? "red" : "dark-red";
                addWord(x, y, color);
            }
        }
    });

    // ج) قاعدة الوردة الخضراء (الكأس / Sepal)
    for (let i = -2; i <= 2; i++) {
        const x = CX + (i * 12);
        const y = CY + 70 + Math.abs(i) * 4;
        addWord(x, y, "green");
    }
}

// =====================================
