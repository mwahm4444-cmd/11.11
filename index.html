
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Rose, Every Language</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #000;
}
</style>
</head>

<body>

<canvas id="rose"></canvas>

<script>
(() => {
"use strict";

const canvas = document.getElementById("rose");
const ctx = canvas.getContext("2d");

const DESIGN_W = 720;
const DESIGN_H = 1280;

const WORDS = [
    "LOVE","AMOUR","AMORE","AMOR","LIEBE","愛","حب","사랑",
    "愛情","TE AMO","JE T'AIME","TI AMO","EU TE AMO",
    "Я ТЕБЯ ЛЮБЛЮ","我爱你","愛してる","SENI SEVIYORUM",
    "MAHAL KITA","NAKUPENDA","ICH LIEBE DICH","أحبك",
    "사랑해","प्यार","KÄRLEK","LJUBAV","אהבה","AMOR"
];

let width = 0;
let height = 0;
let dpr = 1;
let scale = 1;
let ox = 0;
let oy = 0;

let rows = [];
let started = 0;
let frame = 0;

function seeded(n) {
    const x = Math.sin(n * 127.1 + 311.7) * 43758.5453123;
    return x - Math.floor(x);
}

// Main rose silhouette
function roseShape() {
    const p = new Path2D();

    p.moveTo(360, 770);

    p.bezierCurveTo(315,740,235,690,198,615);
    p.bezierCurveTo(150,520,164,405,230,345);
    p.bezierCurveTo(267,311,311,316,340,355);

    p.bezierCurveTo(351,292,420,274,463,323);
    p.bezierCurveTo(480,341,489,362,489,385);

    p.bezierCurveTo(543,331,608,375,615,457);
    p.bezierCurveTo(629,570,557,684,462,738);

    p.bezierCurveTo(420,761,383,770,360,770);

    p.closePath();

    return p;
}

// Leaves
function leafShape(side) {
    const p = new Path2D();

    p.moveTo(360, 920);

    if (side < 0) {
        p.bezierCurveTo(319,877,242,850,151,885);
        p.bezierCurveTo(191,950,274,974,360,920);
    } else {
        p.bezierCurveTo(402,877,478,850,569,885);
        p.bezierCurveTo(529,950,446,974,360,920);
    }

    p.closePath();

    return p;
}

// Create one broad petal around the flower center
function makePetal(angle) {

    const p = new Path2D();

    const cx = 360;
    const cy = 550;

    function point(x, y) {
        return {
            x: cx + x * Math.cos(angle) - y * Math.sin(angle),
            y: cy + x * Math.sin(angle) + y * Math.cos(angle)
        };
    }

    function move(x, y) {
        const a = point(x, y);
        p.moveTo(a.x, a.y);
    }

    function curve(x1,y1,x2,y2,x3,y3) {
        const a = point(x1,y1);
        const b = point(x2,y2);
        const c = point(x3,y3);

        p.bezierCurveTo(
            a.x,a.y,
            b.x,b.y,
            c.x,c.y
        );
    }

    // Wide rounded petal with a pointed outer tip
    move(-48, 12);

    curve(
        -125,-48,
        -112,-165,
        0,-218
    );

    curve(
        112,-165,
        125,-48,
        48,12
    );

    curve(
        20,32,
        -20,32,
        -48,12
    );

    p.closePath();

    return p;
}

// Eight clearly defined rose petals
function createPetals() {

    const petals = [];

    for (let i = 0; i < 8; i++) {

        const angle =
            -Math.PI / 2 +
            i * (Math.PI * 2 / 8);

        petals.push({
            path: makePetal(angle),

            color: [
                "#ff1749",
                "#c90036",
                "#ed1644",
                "#a90032",
                "#f52952",
                "#c40b39",
                "#e51b46",
                "#b90835"
            ][i]
        });
    }

    return petals;
}

// Inner curled petals
function createInnerPetals() {

    const petals = [];

    // Central left curl
    let p = new Path2D();

    p.moveTo(360,590);
    p.bezierCurveTo(310,555,305,495,345,465);
    p.bezierCurveTo(380,435,425,465,414,500);
    p.bezierCurveTo(405,530,370,540,355,515);
    p.bezierCurveTo(345,500,365,480,380,495);
    p.bezierCurveTo(390,525,380,560,360,590);

    p.closePath();
    petals.push(p);

    // Central right curl
    p = new Path2D();

    p.moveTo(365,595);
    p.bezierCurveTo(405,555,450,545,465,575);
    p.bezierCurveTo(478,610,438,640,405,620);
    p.bezierCurveTo(385,610,395,585,415,585);
    p.bezierCurveTo(435,590,430,610,415,610);
    p.closePath();

    petals.push(p);

    // Lower central petal
    p = new Path2D();

    p.moveTo(350,580);
    p.bezierCurveTo(320,610,330,665,365,685);
    p.bezierCurveTo(400,665,405,625,375,590);
    p.bezierCurveTo(370,620,360,640,350,580);

    p.closePath();
    petals.push(p);

    return petals;
}

// Fill any shape with horizontal word rows
function addWordRows(path, options) {

    const {
        top,
        bottom,
        minX,
        maxX,
        stepY,
        fontSize,
        color,
        delayBase,
        seed,
        spacing = 5,
        rowDelay = .045
    } = options;

    const scanCanvas = document.createElement("canvas");

    scanCanvas.width = DESIGN_W;
    scanCanvas.height = DESIGN_H;

    const scan = scanCanvas.getContext("2d");

    for (
        let y = top, row = 0;
        y <= bottom;
        y += stepY, row++
    ) {

        let left = -1;
        let right = -1;

        for (let x = minX; x <= maxX; x += 2) {

            if (scan.isPointInPath(path, x, y)) {

                if (left < 0) left = x;

                right = x;
            }
        }

        if (left < 0) continue;

        let x = left + 2;
        let wordIndex = 0;

        const font =
            fontSize +
            (seeded(seed + row * 13) - .5) * 1.2;

        ctx.font =
            `${font}px Georgia, "Times New Roman", serif`;

        while (x < right - 5) {

            const n =
                seed +
                row * 997 +
                wordIndex * 31;

            const word =
                WORDS[
                    Math.floor(
                        seeded(n) * WORDS.length
                    )
                ];

            const wordWidth = ctx.measureText(word).width;

            if (x + wordWidth > right - 2) break;

            rows.push({

                x: x + wordWidth / 2,

                y: y + (seeded(n + 5) - .5) * 1.4,

                text: word,

                size: font,

                color: color,

                delay:
                    delayBase +
                    row * rowDelay +
                    wordIndex * .012 +
                    seeded(n + 9) * .09
            });

            x += wordWidth + spacing;

            wordIndex++;
        }
    }
}

// Build the complete rose
function buildArtwork() {

    rows = [];

    const rose = roseShape();

    // Red words forming the rose head
    addWordRows(rose, {

        top: 320,
        bottom: 765,

        minX: 145,
        maxX: 635,

        stepY: 10.5,

        fontSize: 11.5,

        color: "#d90b3e",

        delayBase: .45,

        seed: 17,

        spacing: 5,

        rowDelay: .055
    });

    // Green left leaf
    addWordRows(leafShape(-1), {

        top: 865,
        bottom: 965,

        minX: 140,
        maxX: 365,

        stepY: 10,

        fontSize: 10.5,

        color: "#579b3c",

        delayBase: 5.8,

        seed: 311,

        spacing: 4,

        rowDelay: .035
    });

    // Green right leaf
    addWordRows(leafShape(1), {

        top: 865,
        bottom: 965,

        minX: 355,
        maxX: 580,

        stepY: 10,

        fontSize: 10.5,

        color: "#579b3c",

        delayBase: 5.8,

        seed: 419,

        spacing: 4,

        rowDelay: .035
    });

    // Green stem
    for (
        let y = 755, i = 0;
        y <= 1205;
        y += 11, i++
    ) {

        const word =
            WORDS[
                Math.floor(
                    seeded(800 + i) * WORDS.length
                )
            ];

        rows.push({

            x: 360 + Math.sin(y * .014) * 3,

            y: y,

            text: word,

            size: 10.5,

            color: "#579b3c",

            delay:
                6.3 +
                (y - 755) * .006 +
                seeded(900 + i) * .06
        });
    }

    rows.sort((a,b) => a.delay - b.delay);
}

// Draw the eight broad petals
function drawOuterPetals(elapsed) {

    const reveal = Math.max(
        0,
        Math.min(1, (elapsed - 3.8) / 2.2)
    );

    if (reveal <= 0) return;

    const petals = createPetals();

    ctx.save();

    // Soft rose glow
    ctx.shadowColor = "#c90036";
    ctx.shadowBlur = 13;

    for (let i = 0; i < petals.length; i++) {

        const petal = petals[i];

        ctx.globalAlpha = reveal * .22;

        ctx.fillStyle = petal.color;

        ctx.fill(petal.path);

        // Broad, visible petal separation
        ctx.globalAlpha = reveal * .78;

        ctx.strokeStyle = "#870020";
        ctx.lineWidth = 7;

        ctx.lineJoin = "round";
        ctx.lineCap = "round";

        ctx.stroke(petal.path);

        // Soft highlight on the petal edge
        ctx.globalAlpha = reveal * .48;

        ctx.strokeStyle = "#ff5276";
        ctx.lineWidth = 2.5;

        ctx.stroke(petal.path);
    }

    ctx.restore();
}

// Draw the central rose spiral
function drawInnerPetals(elapsed) {

    const reveal = Math.max(
        0,
        Math.min(1, (elapsed - 5) / 1.8)
    );

    if (reveal <= 0) return;

    const petals = createInnerPetals();

    ctx.save();

    ctx.shadowColor = "#ff1749";
    ctx.shadowBlur = 10;

    for (let i = 0; i < petals.length; i++) {

        ctx.globalAlpha = reveal * .34;

        ctx.fillStyle = [
            "#ff315b",
            "#bd0635",
            "#ed1748"
        ][i];

        ctx.fill(petals[i]);

        ctx.globalAlpha = reveal * .9;

        ctx.strokeStyle = "#79001e";
        ctx.lineWidth = 6;

        ctx.stroke(petals[i]);

        ctx.globalAlpha = reveal * .55;

        ctx.strokeStyle = "#ff5878";
        ctx.lineWidth = 2;

        ctx.stroke(petals[i]);
    }

    ctx.restore();
}

// Responsive screen
function resize() {

    width = window.innerWidth;
    height = window.innerHeight;

    dpr = Math.min(
        window.devicePixelRatio || 1,
        2
    );

    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);

    scale = Math.min(
        width / DESIGN_W,
        height / DESIGN_H
    );

    ox = (width - DESIGN_W * scale) / 2;
    oy = (height - DESIGN_H * scale) / 2;

    ctx.setTransform(dpr,0,0,dpr,0,0);

    buildArtwork();

    started = performance.now();

    cancelAnimationFrame(frame);

    render(started);
}

// Animation
function render(now) {

    ctx.clearRect(0,0,width,height);

    ctx.fillStyle = "#000";

    ctx.fillRect(0,0,width,height);

    const elapsed = (now - started) / 1000;

    ctx.save();

    ctx.translate(ox,oy);

    ctx.scale(scale,scale);

    ctx.textAlign = "center";

    ctx.textBaseline = "middle";

    // Gradually reveal all words
    for (const item of rows) {

        const alpha = Math.max(
            0,
            Math.min(
                1,
                (elapsed - item.delay) / .28
            )
        );

        if (alpha <= 0) continue;

        ctx.globalAlpha = alpha;

        ctx.fillStyle = item.color;

        ctx.font =
            `${item.size}px Georgia, "Times New Roman", serif`;

        ctx.fillText(
            item.text,
            item.x,
            item.y
        );
    }

    ctx.globalAlpha = 1;

    // Eight broad petals
    drawOuterPetals(elapsed);

    // Inner curled petals
    drawInnerPetals(elapsed);

    ctx.restore();

    // Keep the completed rose visible
    if (elapsed < 12) {

        frame = requestAnimationFrame(render);
    }
}

window.addEventListener("resize", resize, {
    passive: true
});

resize();

})();
</script>

</body>
</html>
