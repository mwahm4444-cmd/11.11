<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1 Rose, Every Language</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Georgia', 'Times New Roman', serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        h1 {
            color: #ff3344;
            font-size: 2.5rem;
            margin-bottom: 20px;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 51, 68, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1.03); }
        }

        #canvas-container {
            position: relative;
            width: 500px;
            height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .word {
            position: absolute;
            font-size: 12px;
            white-space: nowrap;
            transition: all 0.5s ease-in-out;
            user-select: none;
        }

        .red { color: #ff2244; }
        .green { color: #22aa44; }
    </style>
</head>
<body>

    <h1>1 Rose, Every Language</h1>
    <div id="canvas-container"></div>

    <script>
        const phrases = [
            "I LOVE YOU", "Te amo", "Je t'aime", "Ich liebe dich", "Te quiero",
            "أحبك", "Mahal kita", "Nakapenda", "S'agapo", "Milujem ťa",
            "Kocham Cię", "Seni seviyorum", "Я тебя люблю", "사랑해요", "我爱你",
            "อารักก์", "Ti amo", "Jeg elsker dig", "Minä rakastan sinua", "Volim te"
        ];

        const container = document.getElementById('canvas-container');
        const totalWords = 150;

        // توليد الوردة باستخدام معادلات رياضية (قلب للأعلى وساق للأفل)
        for (let i = 0; i < totalWords; i++) {
            const el = document.createElement('div');
            el.classList.add('word');
            
            // اختيار جملة عشوائية
            const text = phrases[Math.floor(Math.random() * phrases.length)];
            el.innerText = text;

            let x = 0, y = 0;
            let isRed = true;

            if (i < 100) {
                // الجزء العلوي (الوردة / القلب)
                isRed = true;
                const t = Math.random() * Math.PI * 2;
                // معادلة شكل القلب
                x = 16 * Math.pow(Math.sin(t), 3);
                y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                
                // تكبير الشكل وتوزيع الكلمات داخله عشوائياً
                const scale = 12 + Math.random() * 5;
                x = x * scale;
                y = y * scale - 50;
            } else {
                // الجزء السفلي (الساق والأوراق)
                isRed = false;
                y = (i - 100) * 3 - 20; // تمتد للأسفل
                x = Math.sin(y * 0.1) * 15; // انحناءة بسيطة للساق
            }

            el.classList.add(isRed ? 'red' : 'green');
            
            // تمركز العناصر داخل الحاوية
            el.style.left = `calc(50% + ${x}px)`;
            el.style.top = `calc(50% + ${y}px)`;
            
            // تأثير ظهور تدريجي عشوائي
            el.style.opacity = '0';
            setTimeout(() => {
                el.style.opacity = '0.8';
            }, i * 30);

            container.appendChild(el);
        }
    </script>
</body>
</html>
