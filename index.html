
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Rose — Masterpiece</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #020001;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, sans-serif;
}

h1 {
    color: #ff1a48;
    font-size: clamp(16px, 4vw, 22px);
    letter-spacing: 3px;
    text-align: center;
    text-shadow: 0 0 15px rgba(255,26,72,.8);
    margin: 0 0 8px;
    font-weight: 400;
}

#canvas {
    position: relative;
    width: min(450px, 100vw);
    height: min(620px, 85vh);
    background: radial-gradient(
        ellipse at 50% 38%,
        #19040c 0%,
        #080105 48%,
        #020001 85%
    );
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 35px rgba(255,0,50,.15);
}

.word {
    position: absolute;
    white-space: nowrap;
    transform: translate(-50%, -50%);
    font-size: 10px;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    line-height: 1;
    user-select: none;
    transition: opacity .45s ease;
}

.c-heart {
    color: #ff0033;
    text-shadow: 0 0 7px #ff0033;
}

.c-inner {
    color: #ff3366;
    text-shadow: 0 0 7px #ff3366;
}

.c-mid {
    color: #ff5c8a;
    text-shadow: 0 0 7px #ff5c8a;
}

.c-outer {
    color: #ff85a8;
    text-shadow: 0 0 7px #ff85a8;
}

.c-edge {
    color: #ffc0d0;
    text-shadow: 0 0 6px #ff85a8;
}

.c-stem {
    color: #00e676;
    text-shadow: 0 0 7px #00e676;
}

.c-leaf {
    color: #00c853;
    text-shadow: 0 0 7px #00e676;
}

.c-detail {
    color: #ff1744;
    text-shadow: 0 0 8px #ff1744;
}

</style>
</head>

<body>

<h1>1 Rose, Every Language</h1>

<div id="canvas"></div>

<script>

// ==========================================
// 1. LOVE WORDS
// ==========================================

const phrases = [
    "أحبك",
    "I LOVE YOU",
    "Te amo",
    "Je t'aime",
    "Ich liebe dich",
    "Te quiero",
    "Mahal kita",
    "S'agapo",
    "Milujem ťa",
    "Kocham Cię",
    "Seni seviyorum",
    "Я тебя люблю",
    "사랑해요",
    "我爱你",
    "Ti amo",
    "Eu te amo",
    "Nakapenda",
    "Jeg elsker dig",
    "Minä rakastan sinua",
    "Jag älskar dig",
    "Te dua",
    "Volim te",
    "Obicham te",
    "Ani ohev otah",
    "Ana behibak",
    "Tè amu",
    "Ik hou van jou",
    "Miluji tě",
    "Mən səni sevirəm",
    "Aloha au ia 'oe",
    "Aloha",
    "Namaste",
    "Szil szeretlek"
];

const canvas = document.getElementById("canvas");
const sequence = [];

function addWord(x, y, colorClass, size = 10) {

    const el = document.createElement("div");

    el.className = "word " + colorClass;

    el.textContent =
        phrases[Math.floor(Math.random() * phrases.length)];

    el.style.left = x + "px";
    el.style.top = y + "px";
    el.style.fontSize = size + "px";

    sequence.push(el);
}


// ==========================================
// 2. PETAL GEOMETRY ENGINE
// ==========================================

function petalPoint(
    cx, cy,
    angle,
    length,
    width,
    t,
    u
) {

    const spread =
        Math.pow(Math.sin(Math.PI * t), 0.75);

    const radial = length * t;

    const lateral = u * width * spread;

    return {

        x:
            cx +
            Math.cos(angle) * radial -
            Math.sin(angle) * lateral,

        y:
            cy +
            Math.sin(angle) * radial +
            Math.cos(angle) * lateral

    };
}


// ==========================================
// 3. DETAILED PETAL ENGINE
// ==========================================

function drawDetailedPetal(
    cx, cy,
    angle,
    length,
    width,
    colorClass,
    density = 1
) {

    // جسم البتلة

    for (
        let i = 1;
        i <= 14 * density;
        i++
    ) {

        const t = i / (14 * density);

        for (
            let j = -4;
            j <= 4;
            j++
        ) {

            const u = j / 4;

            const point = petalPoint(
                cx, cy,
                angle,
                length,
                width,
                t,
                u
            );

            addWord(
                point.x,
                point.y,
                colorClass
            );

        }
    }


    // الحواف المضيئة

    for (let i = 1; i <= 25; i++) {

        const t = i / 25;

        for (const side of [-1, 1]) {

            const point = petalPoint(
                cx, cy,
                angle,
                length,
                width,
                t,
                side
            );

            addWord(
                point.x,
                point.y,
                "c-edge"
            );

        }
    }


    // العروق الداخلية

    for (let vein = -2; vein <= 2; vein++) {

        for (let i = 3; i <= 15; i++) {

            const t = i / 16;

            const point = petalPoint(
                cx, cy,
                angle,
                length,
                width * 0.7,
                t,
                vein * 0.2
            );

            addWord(
                point.x,
                point.y,
                colorClass
            );

        }
    }

}


// ==========================================
// 4. SPIRAL ROSE HEART
// ==========================================

function drawRoseHeart(cx, cy, scale) {

    // الحلزون الرئيسي

    for (let i = 0; i < 115; i++) {

        const angle = i * 0.17;

        const radius =
            (1.5 + i * 0.105) * scale;

        const x =
            cx + Math.cos(angle) * radius;

        const y =
            cy + Math.sin(angle) * radius * 0.88;

        addWord(
            x,
            y,
            "c-heart"
        );

    }


    // حلقات المركز

    for (let ring = 0; ring < 5; ring++) {

        const radius =
            (8 + ring * 5) * scale;

        for (let i = 0; i < 42; i++) {

            const angle =
                (i / 42) * Math.PI * 2;

            addWord(
                cx + Math.cos(angle) * radius,
                cy + Math.sin(angle) * radius * 0.88,
                ring < 2 ? "c-heart" : "c-inner"
            );

        }
    }

}


// ==========================================
// 5. ROSE DECORATION
// ==========================================

function drawRoseDecoration(cx, cy, scale) {

    // دوائر زخرفية حول القلب

    for (let ring = 0; ring < 4; ring++) {

        const radius =
            (48 + ring * 12) * scale;

        for (let i = 0; i < 80; i++) {

            const angle =
                (i / 80) * Math.PI * 2;

            const wave =
                Math.sin(angle * 6) * 3 * scale;

            const r = radius + wave;

            addWord(
                cx + Math.cos(angle) * r,
                cy + Math.sin(angle) * r * 0.85,
                ring % 2 === 0 ? "c-detail" : "c-edge"
            );

        }
    }

}


// ==========================================
// 6. ULTIMATE MULTI LAYER ROSE
// ==========================================

function generateDetailedRose(CX, CY, scale) {

    // الطبقة الخارجية

    for (let p = 0; p < 11; p++) {

        const angle =
            (p / 11) * Math.PI * 2;

        drawDetailedPetal(
            CX, CY,
            angle,
            108 * scale,
            29 * scale,
            "c-edge"
        );

    }


    // الطبقة الثانية

    for (let p = 0; p < 10; p++) {

        const angle =
            (p / 10) * Math.PI * 2 + 0.2;

        drawDetailedPetal(
            CX, CY,
            angle,
            88 * scale,
            25 * scale,
            "c-outer"
        );

    }


    // الطبقة الثالثة

    for (let p = 0; p < 9; p++) {

        const angle =
            (p / 9) * Math.PI * 2 + 0.35;

        drawDetailedPetal(
            CX, CY,
            angle,
            67 * scale,
            21 * scale,
            "c-mid"
        );

    }


    // الطبقة الرابعة

    for (let p = 0; p < 8; p++) {

        const angle =
            (p / 8) * Math.PI * 2 + 0.15;

        drawDetailedPetal(
            CX, CY,
            angle,
            48 * scale,
            17 * scale,
            "c-inner"
        );

    }


    // الطبقة الخامسة

    for (let p = 0; p < 7; p++) {

        const angle =
            (p / 7) * Math.PI * 2;

        drawDetailedPetal(
            CX, CY,
            angle,
            32 * scale,
            12 * scale,
            "c-heart"
        );

    }


    // مركز الوردة

    drawRoseHeart(CX, CY, scale);

    // الزخرفة

    drawRoseDecoration(CX, CY, scale);

}


// ==========================================
// 7. THREE ROSES BOUQUET
// ==========================================

// الوردة اليسرى

generateDetailedRose(
    130, 150, 0.7
);

// الوردة اليمنى

generateDetailedRose(
    320, 150, 0.7
);

// الوردة الرئيسية

generateDetailedRose(
    225, 110, 1.1
);


// ==========================================
// 8. GREEN STEM SYSTEM
// ==========================================

function drawStem(
    startX,
    startY,
    endX,
    endY,
    bend = 0
) {

    for (let i = 0; i <= 65; i++) {

        const t = i / 65;

        const x =
            startX +
            (endX - startX) * t +
            Math.sin(t * Math.PI) * bend;

        const y =
            startY +
            (endY - startY) * t;

        addWord(
            x,
            y,
            "c-stem"
        );

    }

}


// الساق الرئيسي

drawStem(
    225, 205,
    225, 585,
    9
);

// ساق الوردة اليسرى

drawStem(
    130, 205,
    205, 480,
    -12
);

// ساق الوردة اليمنى

drawStem(
    320, 205,
    245, 480,
    12
);


// ==========================================
// 9. LEAF SHAPE ENGINE
// ==========================================

function drawLeaf(startX, startY, side, size = 1) {

    const length = 78 * size;
    const width = 25 * size;

    // جسم الورقة

    for (let i = 0; i <= 32; i++) {

        const t = i / 32;

        const spread =
            Math.sin(Math.PI * t);

        const x =
            startX + side * length * t;

        const centerY =
            startY - 20 * Math.sin(t * Math.PI);

        for (let j = -4; j <= 4; j++) {

            const y =
                centerY +
                (j / 4) * width * spread;

            addWord(
                x,
                y,
                "c-leaf"
            );

        }
    }


    // عرق الورقة الرئيسي

    for (let i = 0; i <= 35; i++) {

        const t = i / 35;

        addWord(
            startX + side * length * t,
            startY - 20 * Math.sin(t * Math.PI),
            "c-stem"
        );

    }


    // العروق الجانبية

    for (let vein = 1; vein <= 5; vein++) {

        const t = vein / 6;

        const x =
            startX + side * length * t;

        const y =
            startY - 20 * Math.sin(t * Math.PI);

        const spread =
            Math.sin(Math.PI * t) * width * 0.8;

        for (let j = 1; j <= 5; j++) {

            const v = j / 5;

            addWord(
                x + side * v * 9,
                y - spread * v,
                "c-leaf"
            );

            addWord(
                x + side * v * 9,
                y + spread * v,
                "c-leaf"
            );

        }
    }

    // حواف الورقة

    for (let i = 0; i <= 22; i++) {

        const t = i / 22;

        const spread =
            Math.sin(Math.PI * t) * width;

        const x =
            startX + side * length * t;

        const y =
            startY - 20 * Math.sin(t * Math.PI);

        addWord(
            x,
            y - spread,
            "c-leaf"
        );

        addWord(
            x,
            y + spread,
            "c-leaf"
        );

    }

}


// الأوراق الرئيسية

drawLeaf(210, 310, -1, 1.1);
drawLeaf(240, 365, 1, 1.1);
drawLeaf(210, 435, -1, 0.9);
drawLeaf(240, 490, 1, 0.85);

// أوراق الفروع الجانبية

drawLeaf(175, 300, -1, 0.65);
drawLeaf(275, 320, 1, 0.65);


// ==========================================
// 10. SMALL DECORATIVE LEAVES
// ==========================================

function drawSmallLeaf(x, y, side) {

    for (let i = 0; i < 18; i++) {

        const t = i / 18;

        const spread =
            Math.sin(Math.PI * t) * 9;

        addWord(
            x + side * t * 28,
            y - spread,
            "c-leaf"
        );

        addWord(
            x + side * t * 28,
            y + spread,
            "c-leaf"
        );

    }

}

drawSmallLeaf(215, 275, -1);
drawSmallLeaf(235, 405, 1);
drawSmallLeaf(215, 515, -1);


// ==========================================
// 11. GRADUAL ANIMATION ENGINE
// ==========================================

let current = 0;

const animationSpeed = 16;

function showNextWord() {

    if (current >= sequence.length) {
        return;
    }

    const word = sequence[current];

    canvas.appendChild(word);

    requestAnimationFrame(() => {

        word.style.opacity = "1";

    });

    current++;

    setTimeout(
        showNextWord,
        animationSpeed
    );

}


// بدء العرض

setTimeout(
    showNextWord,
    500
);

</script>

</body>
</html>
