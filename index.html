
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>1 Rose, Every Language</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    display: grid;
    place-items: center;
    font-family: Georgia, serif;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}
</style>
</head>

<body>

<canvas id="rose" aria-label="A rose gradually formed from words in many languages"></canvas>

<script>
(() => {
    "use strict";

    const canvas = document.getElementById("rose");
    const ctx = canvas.getContext("2d");

    const words = [
        "LOVE","AMOUR","AMORE","愛","حب","AMOR",
        "LIEBE","사랑","愛情","प्यार","LJUBAV",
        "אהבה","Любовь","SEVGİ","KÄRLEK",
        "TE AMO","Я ТЕБЯ ЛЮБЛЮ","TI AMO",
        "JE T'AIME","사랑해","我爱你",
        "愛してる","أحبك","MAHAL KITA",
        "EU TE AMO","LOVE","AMOUR","愛","LIEBE"
    ];

    const rand = (n) => {
        const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
        return x - Math.floor(x);
    };

    let W = 0;
    let H = 0;
    let dpr = 1;
    let items = [];
    let titlePoints = [];
    let start = 0;
    let raf = 0;
    let scale = 1;
    let cx = 0;
    let cy = 0;
    let unit = 1;

    function rosePath(x, y, s) {
        const p = new Path2D();

        p.moveTo(x, y + s * .43);

        p.bezierCurveTo(
            x-s*.08, y+s*.31,
            x-s*.43, y+s*.17,
            x-s*.46, y-s*.10
        );

        p.bezierCurveTo(
            x-s*.49, y-s*.36,
            x-s*.28, y-s*.48,
            x-s*.10, y-s*.34
        );

        p.bezierCurveTo(
            x-s*.04, y-s*.52,
            x+s*.17, y-s*.51,
            x+s*.20, y-s*.31
        );

        p.bezierCurveTo(
            x+s*.40, y-s*.45,
            x+s*.53, y-s*.24,
            x+s*.42, y+s*.02
        );

        p.bezierCurveTo(
            x+s*.36, y+s*.20,
            x+s*.12, y+s*.35,
            x, y+s*.43
        );

        p.closePath();
        return p;
    }

    function leafPath(x, y, s, side) {
        const p = new Path2D();
        const dir = side;

        p.moveTo(x, y);

        p.quadraticCurveTo(
            x+dir*s*.18, y-s*.20,
            x+dir*s*.55, y-s*.22
        );

        p.quadraticCurveTo(
            x+dir*s*.48, y+s*.02,
            x, y
        );

        p.closePath();
        return p;
    }

    function resize() {
        dpr = Math.min(devicePixelRatio || 1, 2);

        W = innerWidth;
        H = innerHeight;

        canvas.width = Math.round(W*dpr);
        canvas.height = Math.round(H*dpr);

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        scale = Math.min(W/600, H/760)*.94;

        cx = W/2;
        cy = H/2 + 8*scale;
        unit = scale;

        build();

        start = performance.now();

        cancelAnimationFrame(raf);
        draw(start);
    }

    function build() {
        items = [];

        const s = 255*unit;
        const x = cx;
        const y = cy-64*unit;

        const head = rosePath(x, y, s);

        const headBox = {
            l: x-s*.5,
            r: x+s*.55,
            t: y-s*.55,
            b: y+s*.45
        };

        let index = 0;

        // Rose petals

        for (
            let yy = headBox.t;
            yy < headBox.b;
            yy += 8.1*unit
        ) {
            for (
                let xx = headBox.l;
                xx < headBox.r;
                xx += 8.1*unit
            ) {
                const j = index++;

                const px = xx+(rand(j+3)-.5)*2.2*unit;
                const py = yy+(rand(j+9)-.5)*2.2*unit;

                if (ctx.isPointInPath(head, px, py)) {

                    const word = words[
                        Math.floor(rand(j+21)*words.length)
                    ];

                    const size = (5.3+rand(j+31)*2)*unit;

                    items.push({
                        x: px,
                        y: py,
                        word,
                        size,
                        delay: rand(j+51)*6.2,
                        color: rand(j+71)>.28
                            ? "#ff174d"
                            : "#c90036",
                        rot: (rand(j+91)-.5)*.08
                    });
                }
            }
        }

        // Stem

        const stemX = x;
        const stemTop = y+s*.36;
        const stemBottom = cy+292*unit;

        for (
            let yy = stemTop;
            yy < stemBottom;
            yy += 8.2*unit
        ) {
            const j = index++;

            items.push({
                x: stemX+(rand(j)-.5)*5*unit,
                y: yy,
                word: words[
                    Math.floor(rand(j+8)*words.length)
                ],
                size: 5.5*unit,
                delay: 6.2+rand(j+18)*2,
                color: "#4b9b38",
                rot: 0
            });
        }

        // Leaves

        for (const side of [-1, 1]) {

            const lx = x+side*3*unit;
            const ly = cy+120*unit;

            const leaf = leafPath(
                lx,
                ly,
                145*unit,
                side
            );

            const bounds = {
                l: lx-150*unit,
                r: lx+150*unit,
                t: ly-75*unit,
                b: ly+20*unit
            };

            for (
                let yy = bounds.t;
                yy < bounds.b;
                yy += 8.4*unit
            ) {
                for (
                    let xx = bounds.l;
                    xx < bounds.r;
                    xx += 8.4*unit
                ) {
                    const j = index++;

                    const px = xx+(rand(j+3)-.5)*2*unit;
                    const py = yy+(rand(j+6)-.5)*2*unit;

                    if (ctx.isPointInPath(leaf, px, py)) {

                        items.push({
                            x: px,
                            y: py,
                            word: words[
                                Math.floor(rand(j+10)*words.length)
                            ],
                            size: 5.2*unit,
                            delay: 7+rand(j+14)*1.7,
                            color: "#58a83c",
                            rot: 0
                        });
                    }
                }
            }
        }

        // Curved title

        titlePoints = [];

        const title = "1 Rose, Every Language";
        const radius = 220*unit;
        const centerY = cy-330*unit;

        for (let i = 0; i < title.length; i++) {

            const a = -Math.PI*.84 +
                (i/(title.length-1))*Math.PI*.68;

            titlePoints.push({
                ch: title[i],
                x: cx+Math.cos(a)*radius,
                y: centerY+Math.sin(a)*radius,
                angle: a+Math.PI/2,
                delay: i*.11
            });
        }

        items.sort((a, b) => a.delay-b.delay);
    }

    function draw(now) {

        ctx.clearRect(0, 0, W, H);

        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, W, H);

        const elapsed = (now-start)/1000;

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        // Title animation

        ctx.save();

        for (const p of titlePoints) {

            const k = Math.max(
                0,
                Math.min(1, (elapsed-p.delay)/.35)
            );

            if (!k) continue;

            ctx.save();

            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle);

            ctx.globalAlpha = k;
            ctx.fillStyle = "#ff174d";

            ctx.font = `bold ${Math.max(13,18*unit)}px Arial`;

            ctx.fillText(p.ch, 0, 0);

            ctx.restore();
        }

        ctx.restore();

        // Gradual word formation

        for (const it of items) {

            const k = Math.max(
                0,
                Math.min(1, (elapsed-it.delay)/.42)
            );

            if (k <= 0) continue;

            ctx.save();

            ctx.translate(it.x, it.y);
            ctx.rotate(it.rot);

            ctx.globalAlpha = k;

            ctx.fillStyle = it.color;
            ctx.shadowColor = it.color;
            ctx.shadowBlur = 1.8*unit;

            ctx.font = `${Math.max(4.2,it.size)}px Georgia,serif`;

            ctx.fillText(it.word, 0, 0);

            ctx.restore();
        }

        // Petal details

        if (elapsed > 3) {

            const alpha = Math.min(
                .22,
                (elapsed-3)*.035
            );

            const x = cx;
            const y = cy-64*unit;
            const s = 255*unit;

            ctx.save();

            ctx.globalAlpha = alpha;
            ctx.strokeStyle = "#ff456b";
            ctx.lineWidth = .7*unit;

            ctx.beginPath();

            ctx.moveTo(x, y+s*.34);

            ctx.bezierCurveTo(
                x-s*.17, y+s*.03,
                x-s*.30, y-s*.20,
                x-s*.12, y-s*.36
            );

            ctx.moveTo(x, y+s*.34);

            ctx.bezierCurveTo(
                x+s*.17, y+s*.03,
                x+s*.34, y-s*.16,
                x+s*.24, y-s*.36
            );

            ctx.moveTo(x-s*.29, y-s*.16);

            ctx.quadraticCurveTo(
                x, y-s*.02,
                x+s*.30, y-s*.14
            );

            ctx.stroke();
            ctx.restore();
        }

        // Stop after formation

        if (elapsed < 10.5) {
            raf = requestAnimationFrame(draw);
        }
    }

    addEventListener("resize", resize, {
        passive: true
    });

    resize();

})();
</script>

</body>
</html>
