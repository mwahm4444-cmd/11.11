
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal Roses — Eternal Love</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #020001;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, sans-serif;
}

h1 {
    color: #ff1a48;
    font-size: clamp(16px, 4vw, 22px);
    letter-spacing: 3px;
    text-align: center;
    text-shadow: 0 0 15px rgba(255,26,72,.8);
    margin: 0 0 8px;
    font-weight: 400;
}

#canvas {
    position: relative;
    width: min(450px, 100vw);
    height: min(620px, 85vh);
    background:
        radial-gradient(ellipse at 50% 28%,
        #250510 0%,
        #100208 42%,
        #020001 85%);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 0 35px rgba(255,0,50,.15);
}

.word {
    position: absolute;
    white-space: nowrap;
    transform: translate(-50%,-50%);
    font-size: 10px;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    line-height: 1;
    user-select: none;
    transition: opacity .5s ease;
}

/* ROYAL RED PETALS */

.c-heart {
    color: #ff002f;
    text-shadow:
        0 0 5px #ff0033,
        0 0 12px rgba(255,0,40,.9);
}

.c-inner {
    color: #ff174f;
    text-shadow:
        0 0 6px #ff174f,
        0 0 12px rgba(255,23,79,.7);
}

.c-mid {
    color: #ff4779;
    text-shadow:
        0 0 7px #ff4779,
        0 0 14px rgba(255,71,121,.7);
}

.c-outer {
    color: #ff789d;
    text-shadow:
        0 0 7px #ff789d,
        0 0 12px rgba(255,120,157,.6);
}

.c-edge {
    color: #ffc0d2;
    text-shadow:
        0 0 6px #ff9db8,
        0 0 12px #ff4779;
}

.c-gold {
    color: #ffd18b;
    text-shadow:
        0 0 5px #ffad55,
        0 0 12px rgba(255,170,80,.8);
}

/* GREEN STRUCTURE */

.c-stem {
    color: #00e676;
    text-shadow: 0 0 7px #00e676;
}

.c-leaf {
    color: #00c853;
    text-shadow:
        0 0 6px #00e676,
        0 0 12px rgba(0,200,83,.7);
}

.c-root {
    color: #32ed86;
    text-shadow:
        0 0 7px #00e676,
        0 0 13px rgba(0,230,118,.8);
}

</style>
</head>

<body>

<h1>1 Rose, Every Language</h1>
<div id="canvas"></div>

<script>

// ============================================
// 01 — WORD COLLECTION
// ============================================

const phrases = [
    "أحبك",
    "I LOVE YOU",
    "Te amo",
    "Je t'aime",
    "Ich liebe dich",
    "Te quiero",
    "Mahal kita",
    "S'agapo",
    "Milujem ťa",
    "Kocham Cię",
    "Seni seviyorum",
    "Я тебя люблю",
    "사랑해요",
    "我爱你",
    "Ti amo",
    "Eu te amo",
    "Nakapenda",
    "Jeg elsker dig",
    "Minä rakastan sinua",
    "Jag älskar dig",
    "Te dua",
    "Volim te",
    "Obicham te",
    "Ani ohev otah",
    "Ana behibak",
    "Tè amu",
    "Ik hou van jou",
    "Miluji tě",
    "Mən səni sevirəm",
    "Aloha au ia 'oe",
    "Aloha",
    "Namaste",
    "Szil szeretlek"
];

const canvas = document.getElementById("canvas");
const sequence = [];

function addWord(x, y, color, size = 10) {

    const el = document.createElement("div");

    el.className = "word " + color;

    el.textContent =
        phrases[Math.floor(Math.random() * phrases.length)];

    el.style.left = x + "px";
    el.style.top = y + "px";
    el.style.fontSize = size + "px";

    sequence.push(el);
}


// ============================================
// 02 — ROYAL PETAL MATHEMATICS
// ============================================

// كل بتلة لها انحناء خاص بها

function royalPetalPoint(
    cx, cy,
    angle,
    length,
    width,
    t,
    u,
    curl = 0
) {

    const shape =
        Math.pow(Math.sin(Math.PI * t), 0.72);

    const radial =
        length * t;

    const lateral =
        u * width * shape;

    const curling =
        curl * Math.sin(t * Math.PI * 2);

    return {

        x:
            cx +
            Math.cos(angle) * radial -
            Math.sin(angle) * lateral +
            Math.cos(angle + Math.PI / 2) * curling,

        y:
            cy +
            Math.sin(angle) * radial +
            Math.cos(angle) * lateral +
            Math.sin(angle + Math.PI / 2) * curling

    };
}


// ============================================
// 03 — INDIVIDUAL ROYAL PETAL
// ============================================

function drawRoyalPetal(
    cx, cy,
    angle,
    length,
    width,
    color,
    curl = 0
) {

    // سطح البتلة

    for (let i = 1; i <= 11; i++) {

        const t = i / 11;

        for (let j = -3; j <= 3; j++) {

            const u = j / 3;

            const point = royalPetalPoint(
                cx, cy,
                angle,
                length,
                width,
                t,
                u,
                curl
            );

            addWord(
                point.x,
                point.y,
                color
            );

        }
    }


    // الحافة العلوية الملتفة

    for (let i = 0; i <= 22; i++) {

        const t = i / 22;

        for (const side of [-1, 1]) {

            const point = royalPetalPoint(
                cx, cy,
                angle,
                length,
                width,
                t,
                side,
                curl
            );

            addWord(
                point.x,
                point.y,
                "c-edge"
            );

        }
    }


    // خطوط العروق المزخرفة

    for (let vein = -2; vein <= 2; vein++) {

        for (let i = 3; i <= 12; i++) {

            const t = i / 13;

            const point = royalPetalPoint(
                cx, cy,
                angle,
                length,
                width,
                t,
                vein * .22,
                curl
            );

            addWord(
                point.x,
                point.y,
                "c-outer"
            );

        }
    }


    // أطراف ذهبية زخرفية

    for (let i = 1; i <= 9; i++) {

        const t = i / 10;

        const point = royalPetalPoint(
            cx, cy,
            angle,
            length,
            width,
            t,
            1,
            curl
        );

        addWord(
            point.x,
            point.y,
            "c-gold"
        );

    }

}


// ============================================
// 04 — SPIRAL CENTER
// ============================================

function drawRoyalHeart(cx, cy, scale) {

    // حلزون القلب

    for (let i = 0; i < 125; i++) {

        const angle = i * .19;

        const radius =
            (1.5 + i * .105) * scale;

        const x =
            cx + Math.cos(angle) * radius;

        const y =
            cy + Math.sin(angle) * radius * .85;

        addWord(
            x,
            y,
            "c-heart"
        );

    }


    // دوائر داخلية

    for (let ring = 0; ring < 5; ring++) {

        const radius =
            (7 + ring * 5) * scale;

        for (let i = 0; i < 38; i++) {

            const angle =
                i / 38 * Math.PI * 2;

            addWord(
                cx + Math.cos(angle) * radius,
                cy + Math.sin(angle) * radius * .85,
                ring < 2 ? "c-heart" : "c-gold"
            );

        }
    }

}


// ============================================
// 05 — ORNAMENTAL ROSE RINGS
// ============================================

function drawOrnaments(cx, cy, scale) {

    for (let ring = 0; ring < 3; ring++) {

        const radius =
            (48 + ring * 13) * scale;

        for (let i = 0; i < 85; i++) {

            const angle =
                i / 85 * Math.PI * 2;

            const wave =
                Math.sin(angle * 7) *
                3 * scale;

            const r = radius + wave;

            addWord(
                cx + Math.cos(angle) * r,
                cy + Math.sin(angle) * r * .84,
                ring === 1 ? "c-gold" : "c-edge"
            );

        }
    }

}


// ============================================
// 06 — ROYAL BLOOM ENGINE
// ============================================

function generateRoyalRose(cx, cy, scale, rotation = 0) {

    // الطبقة الخارجية: بتلات عريضة

    for (let p = 0; p < 11; p++) {

        const angle =
            p / 11 * Math.PI * 2 + rotation;

        drawRoyalPetal(
            cx, cy,
            angle,
            105 * scale,
            27 * scale,
            "c-edge",
            5 * scale
        );

    }


    // الطبقة الثانية: بتلات ملتفة

    for (let p = 0; p < 9; p++) {

        const angle =
            p / 9 * Math.PI * 2 +
            rotation + .24;

        drawRoyalPetal(
            cx, cy,
            angle,
            83 * scale,
            24 * scale,
            "c-outer",
            7 * scale
        );

    }


    // الطبقة الثالثة: البتلات الحمراء

    for (let p = 0; p < 8; p++) {

        const angle =
            p / 8 * Math.PI * 2 +
            rotation + .35;

        drawRoyalPetal(
            cx, cy,
            angle,
            65 * scale,
            20 * scale,
            "c-mid",
            6 * scale
        );

    }


    // الطبقة الرابعة: البتلات الداخلية

    for (let p = 0; p < 7; p++) {

        const angle =
            p / 7 * Math.PI * 2 +
            rotation + .18;

        drawRoyalPetal(
            cx, cy,
            angle,
            47 * scale,
            16 * scale,
            "c-inner",
            4 * scale
        );

    }


    // الطبقة الخامسة: قلب الوردة

    for (let p = 0; p < 6; p++) {

        const angle =
            p / 6 * Math.PI * 2 +
            rotation;

        drawRoyalPetal(
            cx, cy,
            angle,
            31 * scale,
            11 * scale,
            "c-heart",
            3 * scale
        );

    }


    // القلب الحلزوني

    drawRoyalHeart(cx, cy, scale);

    // الزخارف

    drawOrnaments(cx, cy, scale);

}


// ============================================
// 07 — ROYAL BOUQUET
// ============================================

// وردة جانبية يسار

generateRoyalRose(
    130, 145, .67, -.18
);

// وردة جانبية يمين

generateRoyalRose(
    320, 145, .67, .18
);

// الوردة الملكية المركزية

generateRoyalRose(
    225, 190, 1.02, .08
);


// ============================================
// 08 — GREEN STEMS
// ============================================

function drawStem(
    x1, y1,
    x2, y2,
    bend = 0
) {

    for (let i = 0; i <= 65; i++) {

        const t = i / 65;

        const x =
            x1 +
            (x2 - x1) * t +
            Math.sin(t * Math.PI) * bend;

        const y =
            y1 +
            (y2 - y1) * t;

        addWord(
            x,
            y,
            "c-stem"
        );

    }

}


// الساق المركزي

drawStem(
    225, 270,
    225, 570,
    10
);

// الساق الأيسر

drawStem(
    145, 220,
    195, 465,
    -12
);

// الساق الأيمن

drawStem(
    305, 220,
    255, 465,
    12
);


// ============================================
// 09 — LUXURY LEAF ENGINE
// ============================================

function drawRoyalLeaf(
    startX,
    startY,
    side,
    length = 75,
    width = 22
) {

    // جسم الورقة

    for (let i = 1; i <= 30; i++) {

        const t = i / 30;

        const spread =
            Math.sin(Math.PI * t);

        const x =
            startX + side * length * t;

        const centerY =
            startY - Math.sin(Math.PI * t) * 18;

        for (let j = -4; j <= 4; j++) {

            const y =
                centerY +
                j / 4 * width * spread;

            addWord(
                x,
                y,
                "c-leaf"
            );

        }
    }


    // عرق الورقة المركزي

    for (let i = 0; i <= 30; i++) {

        const t = i / 30;

        addWord(
            startX + side * length * t,
            startY - Math.sin(Math.PI * t) * 18,
            "c-stem"
        );

    }


    // العروق الجانبية

    for (let vein = 1; vein <= 6; vein++) {

        const t = vein / 7;

        const x =
            startX + side * length * t;

        const y =
            startY - Math.sin(Math.PI * t) * 18;

        const spread =
            Math.sin(Math.PI * t) * width;

        for (let j = 1; j <= 5; j++) {

            const v = j / 5;

            addWord(
                x + side * v * 8,
                y - spread * v,
                "c-leaf"
            );

            addWord(
                x + side * v * 8,
                y + spread * v,
                "c-leaf"
            );

        }
    }


    // حدود الورقة

    for (let i = 0; i <= 25; i++) {

        const t = i / 25;

        const x =
            startX + side * length * t;

        const y =
            startY - Math.sin(Math.PI * t) * 18;

        const spread =
            Math.sin(Math.PI * t) * width;

        addWord(x, y - spread, "c-leaf");
        addWord(x, y + spread, "c-leaf");

    }

}


// الأوراق الكبيرة

drawRoyalLeaf(210, 310, -1, 82, 23);
drawRoyalLeaf(240, 355, 1, 82, 23);
drawRoyalLeaf(210, 425, -1, 73, 20);
drawRoyalLeaf(240, 475, 1, 72, 20);

// الأوراق الصغيرة

drawRoyalLeaf(180, 270, -1, 45, 13);
drawRoyalLeaf(270, 290, 1, 45, 13);
drawRoyalLeaf(205, 510, -1, 42, 12);
drawRoyalLeaf(245, 525, 1, 42, 12);


// ============================================
// 10 — GREEN ROOT SYSTEM
// ============================================

function drawRoot(
    x1, y1,
    x2, y2,
    bend = 0
) {

    for (let i = 0; i <= 32; i++) {

        const t = i / 32;

        const x =
            x1 +
            (x2 - x1) * t +
            Math.sin(t * Math.PI) * bend;

        const y =
            y1 +
            (y2 - y1) * t;

        addWord(
            x,
            y,
            "c-root"
        );

    }

}


// جذور رئيسية

drawRoot(225, 565, 225, 610, 0);
drawRoot(225, 580, 160, 610, -5);
drawRoot(225, 580, 290, 610, 5);

// تفرعات الجذور

drawRoot(190, 590, 170, 615, -5);
drawRoot(260, 590, 280, 615, 5);
drawRoot(225, 600, 205, 618, -3);
drawRoot(225, 600, 245, 618, 3);


// ============================================
// 11 — GRADUAL WORD ANIMATION
// ============================================

let current = 0;

const animationSpeed = 12;

function showNextWord() {

    if (current >= sequence.length) {
        return;
    }

    const word = sequence[current];

    canvas.appendChild(word);

    requestAnimationFrame(() => {
        word.style.opacity = "1";
    });

    current++;

    setTimeout(
        showNextWord,
        animationSpeed
    );

}


// ============================================
// 12 — START
// ============================================

setTimeout(() => {
    showNextWord();
}, 500);

</script>

</body>
</html>
