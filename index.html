
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>I LOVE YOU — 11:11</title>
<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;
 background:#000;overflow:hidden;
 color:#ddd;font-family:monospace;
}
#stage{
 height:72%;
 width:100%;
 position:relative;
 background:#000;
}
canvas{
 width:100%;height:100%;display:block;
}
.hud{
 position:absolute;left:12px;bottom:12px;
 color:#85858b;font-size:10px;
 line-height:1.7;
}
.clock{
 position:absolute;right:14px;top:13px;
 font-size:10px;color:#e58ca9;
}
#terminal{
 height:28%;
 background:#080808;
 border-top:1px solid #383838;
 overflow:hidden;
 position:relative;
}
.topbar{
 height:30px;padding:8px 12px;
 border-bottom:1px solid #252525;
 color:#85858b;font-size:10px;
 display:flex;justify-content:space-between;
}
#code{
 padding:9px 12px;
 font-size:10px;
 line-height:1.85;
 color:#a9a9b4;
 white-space:pre;
}
.line{
 display:flex;
 gap:12px;
 min-height:18px;
}
.num{color:#555;min-width:20px;text-align:right}
.pink{color:#e78baa}
.green{color:#78bd8a}
.blue{color:#87aee9}
.gold{color:#d8c18a}
.active{
 background:linear-gradient(90deg,#38202b,#141014);
 border-left:2px solid #e78baa;
}
</style>
</head>
<body>

<div id="stage">
 <canvas id="art"></canvas>

 <div class="clock">● 11:11 <span id="time">00.00s</span></div>

 <div class="hud">
  @ 11:11 · 2026<br>
  bloom <span id="bloom">0.0</span>% &nbsp;
  petals 36<br>
  message: I LOVE YOU
 </div>
</div>

<div id="terminal">
 <div class="topbar">
  <span>$ py love.py</span>
  <span style="color:#78bd8a">● running · 30 fps</span>
 </div>
 <div id="code"></div>
</div>

<script>
const canvas=document.getElementById("art");
const ctx=canvas.getContext("2d");

let W,H,D,start=performance.now();
let stars=[];
let codeIndex=0;

const phrase="I LOVE YOU";
const repeat="I LOVE YOU  ";
const lines=[
['# 11:11 — a flower made of words','green'],
['import numpy as np','blue'],
['import time','blue'],
['MESSAGE = "I LOVE YOU"','pink'],
['PETALS = 36','gold'],
['',''],
['def create_petal(angle, size):','pink'],
['    shape = elliptical_curve(angle)',''],
['    letters = repeat(MESSAGE)','gold'],
['    return fill(shape, letters)','pink'],
['',''],
['def open_flower(t):','pink'],
['    bloom = smoothstep(t)',''],
['    petals = unfold(PETALS, bloom)',''],
['    return draw_rose(petals)','pink'],
['',''],
['def grow_stem():','pink'],
['    leaves = form_with_letters(MESSAGE)','gold'],
['    return green_stem(leaves)','green'],
['',''],
['# Every letter becomes a petal.','green'],
['# Every petal becomes a wish.','green'],
['print("I LOVE YOU")','blue'],
];

function resize(){
 D=Math.min(devicePixelRatio||1,2);
 W=canvas.clientWidth;
 H=canvas.clientHeight;
 canvas.width=W*D;
 canvas.height=H*D;
 ctx.setTransform(D,0,0,D,0,0);

 stars=Array.from({length:125},()=>({
  x:Math.random()*W,
  y:Math.random()*H,
  r:.4+Math.random()*1.1,
  phase:Math.random()*6,
  speed:.8+Math.random()*2
 }));
}
new ResizeObserver(resize).observe(canvas);
resize();

function textFillEllipse(cx,cy,rx,ry,rotation,progress,color){
 if(progress<=0)return;

 ctx.save();
 ctx.translate(cx,cy);
 ctx.rotate(rotation);
 ctx.beginPath();
 ctx.ellipse(0,0,rx*progress,ry*progress,0,0,Math.PI*2);
 ctx.clip();

 const font=Math.max(5,Math.min(8, W/55));
 ctx.font="bold "+font+"px monospace";
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.fillStyle=color;

 for(let y=-ry;y<ry;y+=font+2){
  const shift=(Math.floor((y+ry)/10)%2)*14;
  for(let x=-rx;x<rx;x+=68){
   ctx.fillText(repeat,x+shift,y);
  }
 }

 ctx.restore();
}

function drawRose(t){
 const scale=Math.min(W/440,H/520);
 const cx=W/2;
 const cy=H*.43;
 const grow=Math.min(1,Math.max(0,t/9));

 ctx.save();
 ctx.translate(cx,cy);
 ctx.scale(scale,scale);

 // Stem: built from repeating words
 const stemProgress=Math.min(1,t/4);
 if(stemProgress>0){
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.bezierCurveTo(-8,70,9,145,0,230*stemProgress);
  ctx.strokeStyle="#319b59";
  ctx.lineWidth=3;
  ctx.stroke();

  ctx.font="bold 7px monospace";
  ctx.textAlign="center";
  ctx.fillStyle="#80d59a";

  for(let y=25;y<220*stemProgress;y+=12){
   ctx.fillText("I LOVE YOU",0,y);
  }
  ctx.restore();
 }

 // Leaves made from words
 const leafProgress=Math.min(1,Math.max(0,(t-2)/3));

 if(leafProgress>0){
  textFillEllipse(-26,105,49,17,-.55,leafProgress,"#45b96e");
  textFillEllipse(27,159,48,16,.55,leafProgress,"#279b55");
 }

 // Outer petals
 const layers=[
  {n:12,rx:25,ry:76,dist:48,delay:0},
  {n:10,rx:23,ry:63,dist:32,delay:1.5},
  {n:8,rx:19,ry:48,dist:18,delay:3},
  {n:6,rx:15,ry:34,dist:7,delay:4}
 ];

 layers.forEach((layer,L)=>{
  for(let i=0;i<layer.n;i++){
   const delay=layer.delay+i*.13;
   const p=Math.max(0,Math.min(1,(t-delay)/5));
   if(p<=0)continue;

   const angle=i*Math.PI*2/layer.n+L*.24+t*.025;
   const x=Math.cos(angle)*layer.dist*p;
   const y=Math.sin(angle)*layer.dist*p-12;

   const colors=[
    "#e36c91","#ff9bb5",
    "#ed416d","#bd204d"
   ];

   textFillEllipse(
    x,y,layer.rx,layer.ry,
    -angle,p,colors[L]
   );
  }
 });

 // Center of the flower
 const center=Math.min(1,Math.max(0,(t-5)/3));
 if(center>0){
  ctx.beginPath();
  ctx.arc(0,-12,15*center,0,Math.PI*2);
  ctx.fillStyle="#8f1239";
  ctx.fill();

  ctx.fillStyle="#ffd0dd";
  ctx.font="bold 7px monospace";
  ctx.textAlign="center";
  ctx.fillText("LOVE",0,-10);
 }

 ctx.restore();
 return grow;
}

function sparkle(x,y,r,alpha){
 ctx.save();
 ctx.globalAlpha=alpha;
 ctx.strokeStyle="#ddd9ed";
 ctx.lineWidth=.65;
 ctx.beginPath();
 ctx.moveTo(x-r*2,y);
 ctx.lineTo(x+r*2,y);
 ctx.moveTo(x,y-r*2);
 ctx.lineTo(x,y+r*2);
 ctx.stroke();
 ctx.beginPath();
 ctx.arc(x,y,r*.5,0,Math.PI*2);
 ctx.fillStyle="#fff";
 ctx.fill();
 ctx.restore();
}

function render(now){
 const t=(now-start)/1000;
 ctx.clearRect(0,0,W,H);

 // Star field
 stars.forEach(s=>{
  const alpha=.15+.8*(.5+.5*Math.sin(t*s.speed+s.phase));
  ctx.fillStyle=`rgba(235,230,255,${alpha})`;
  ctx.fillRect(s.x,s.y,s.r,s.r);
 });

 // Special sparkling stars
 for(let i=0;i<12;i++){
  const s=stars[i*7];
  sparkle(s.x,s.y,2+Math.sin(t+i)*1.2,
    .25+.5*Math.sin(t*1.5+i)**2);
 }

 const bloom=drawRose(t);
 document.getElementById("bloom").textContent=
  (bloom*100).toFixed(1);
 document.getElementById("time").textContent=
  t.toFixed(2)+"s";

 requestAnimationFrame(render);
}
requestAnimationFrame(render);

// Code editor animation
function showCode(){
 const box=document.getElementById("code");
 let html="";
 for(let i=0;i<8;i++){
  const index=(codeIndex+i)%lines.length;
  const [content,color]=lines[index];
  const cls=color||"";
  html+=`<div class="line ${i===0?'active':''}">
  <span class="num">${String(index+1).padStart(3," ")}</span>
  <span class="${cls}">${content||"&nbsp;"}</span>
  </div>`;
 }
 box.innerHTML=html;
 codeIndex=(codeIndex+1)%lines.length;
}
showCode();
setInterval(showCode,850);
</script>
</body>
</html>
