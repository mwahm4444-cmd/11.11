
<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>One Rose, Every Language</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    height: 100vh;
    background: #000;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: Georgia, serif;
}

h1 {
    color: #ff3344;
    font-size: 23px;
    text-shadow: 0 0 12px #ff1744;
}

#canvas {
    position: relative;
    width: min(96vw, 440px);
    height: min(82vh, 570px);
}

.word {
    position: absolute;
    transform: translate(-50%, -50%);
    font-size: 9px;
    white-space: nowrap;
    opacity: 0;
}

.red {
    color: #ff1744;
    text-shadow: 0 0 5px #ff1744;
}

.green {
    color: #00e676;
    text-shadow: 0 0 5px #00e676;
}
</style>
</head>

<body>

<h1>1 Rose, Every Language</h1>
<div id="canvas"></div>

<script>
const phrases = [
    "I LOVE YOU", "Te amo", "Je t'aime",
    "Ich liebe dich", "Te quiero",
    "أحبك", "Mahal kita", "Nakapenda",
    "S'agapo", "Milujem ťa",
    "Kocham Cię", "Seni seviyorum",
    "Я тебя люблю", "사랑해요", "我爱你"
];

const canvas = document.getElementById("canvas");

const CX = 220;
const CY = 205;
const sequence = [];

function add(x, y, color) {
    const el = document.createElement("div");

    el.className = "word " + color;
    el.textContent = phrases[
        Math.floor(Math.random() * phrases.length)
    ];

    el.style.left = x + "px";
    el.style.top = y + "px";

    sequence.push({
        el,
        x,
        y,
        color
    });
}

// ==================================
// 1. الجذور: من أسفل إلى أعلى
// ==================================

for (let i = 0; i < 55; i++) {
    const t = i / 55;

    add(CX + Math.sin(t * 5) * t * 60,
        CY + 290 - t * 55, "green");
}

// ==================================
// 2. الساق: الصعود للأعلى
// ==================================

for (let i = 0; i < 85; i++) {
    const t = i / 85;

    add(
        CX + Math.sin(t * 3) * 5,
        CY + 235 - t * 135,
        "green"
    );
}

// ==================================
// 3. الأوراق
// ==================================

for (const side of [-1, 1]) {
    for (let i = 0; i < 35; i++) {
        const t = i / 35;

        add(
            CX + side * t * 90,
            CY + 170 - t * 45 +
            Math.sin(t * Math.PI) * 17,
            "green"
        );
    }
}

// ==================================
// 4. البتلات: رسم المحيط أولاً
// ==================================

const petalPoints = [];

for (let i = 0; i < 700; i++) {
    const angle = i / 700 * Math.PI * 2;

    const radius = 105 * Math.abs(
        Math.cos(4 * angle)
    );

    petalPoints.push({
        x: CX + Math.cos(angle) * radius,
        y: CY + Math.sin(angle) * radius * 0.82,
        angle
    });
}

// ترتيب محيط الوردة من الأسفل إلى الأعلى
petalPoints.sort((a, b) => b.y - a.y);

for (const p of petalPoints) {
    add(p.x, p.y, "red");
}

// ==================================
// 5. ملء داخل البتلات
// ==================================

const fillPoints = [];

for (let i = 0; i < 550; i++) {
    const angle = Math.random() * Math.PI * 2;
    const radius = 105 * Math.abs(Math.cos(4 * angle));
    const distance = Math.sqrt(Math.random());

    fillPoints.push({
        x: CX + Math.cos(angle) * radius * distance,
        y: CY + Math.sin(angle) * radius * distance * 0.82
    });
}

fillPoints.sort((a, b) => b.y - a.y);

for (const p of fillPoints) {
    add(p.x, p.y, "red");
}

// ==================================
// 6. الحركة: كلمة بعد كلمة
// ==================================

let index = 0;

function animate() {
    if (index >= sequence.length) return;

    const word = sequence[index].el;

    canvas.appendChild(word);

    word.style.transition = "opacity 0.2s linear";
    word.style.opacity = "1";

    index++;

    setTimeout(animate, 45);
}

// ابدأ بعد نصف ثانية
setTimeout(animate, 500);

</script>
</body>
</html>
