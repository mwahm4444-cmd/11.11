<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Masterpiece - 1 Rose, Every Language</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #010001;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
}

h1 {
    color: #ff1a48;
    font-size: clamp(18px, 4vw, 26px);
    letter-spacing: 4px;
    text-align: center;
    text-shadow: 0 0 20px rgba(255, 26, 72, 0.9);
    margin-bottom: 12px;
    font-weight: 400;
}

#canvas {
    position: relative;
    width: 480px;
    height: 650px;
    background: radial-gradient(circle at center, #120205 0%, #010001 85%);
    border-radius: 16px;
    box-shadow: 0 0 40px rgba(255, 0, 50, 0.2);
}

.word {
    position: absolute;
    white-space: nowrap;
    transform: translate(-50%, -50%);
    font-size: 9.5px;
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    line-height: 1;
    user-select: none;
    transition: opacity 0.4s ease-in-out, transform 0.4s ease-in-out;
}

/* تدرجات ألوان دقيقة تمنح الوردة عمقاً حقيقياً وتفاصيل بارزة */
.c-heart  { color: #ff0033; text-shadow: 0 0 6px rgba(255, 0, 51, 1); }
.c-inner  { color: #ff2a5f; text-shadow: 0 0 6px rgba(255, 42, 95, 0.9); }
.c-mid    { color: #ff4d79; text-shadow: 0 0 6px rgba(255, 77, 121, 0.9); }
.c-outer  { color: #ff759a; text-shadow: 0 0 6px rgba(255, 117, 154, 0.8); }
.c-edge   { color: #ff99b5; text-shadow: 0 0 5px rgba(255, 153, 181, 0.7); }

/* ألوان الساق والأوراق متسقة ومقروءة */
.c-stem   { color: #00e676; text-shadow: 0 0 6px rgba(0, 230, 118, 0.9); }
.c-leaf   { color: #00c853; text-shadow: 0 0 6px rgba(0, 200, 83, 0.8); }
.c-dark-leaf { color: #008744; text-shadow: 0 0 5px rgba(0, 135, 68, 0.7); }
</style>
</head>

<body>

<h1>1 Rose, Every Language</h1>
<div id="canvas"></div>

<script>
// قائمة شاملة لأكثر من 55 لغة حول العالم لكلمة "أحبك"
const globalPhrases = [
    "أحبك", "I LOVE YOU", "Te amo", "Je t'aime", "Ich liebe dich", 
    "Te quiero", "Mahal kita", "S'agapo", "Milujem ťa", "Kocham Cię", 
    "Seni seviyorum", "Я тебя люблю", "사랑해요", "我爱你", "Ti amo", 
    "Eu te amo", "Nakapenda", "Jeg elsker dig", "Minä rakastan sinua", 
    "Jag älskar dig", "Te dua", "Volim te", "Obicham te", "Ani ohev otah",
    "Ana behibak", "Tè amu", "Ik hou van jou", "Miluji tě", "Mən səni sevirəm",
    "Aloha au ia 'oe", "Aloha", "Namaste", "Bulls-e", "Szil szeretlek",
    "Volim te", "Cinta", "Szeretlek", "Te' amo", "Ljubim te"
];

const canvas = document.getElementById("canvas");
const sequence = [];

function addWord(x, y, colorClass) {
    const el = document.createElement("div");
    el.className = "word " + colorClass;
    el.textContent = globalPhrases[Math.floor(Math.random() * globalPhrases.length)];
    el.style.left = x.toFixed(1) + "px";
    el.style.top = y.toFixed(1) + "px";
    sequence.push(el);
}

// دالة هندسية متطورة لرسم وردة مفصلة وواضحة بدون أي تداخل مزعج
function buildAdvancedRose(CX, CY, scale) {
    
    // 1. قلب الوردة الحلزوني (المركز الداكن والعميق)
    for (let i = 0; i < 35; i++) {
        let angle = i * 0.4;
        let r = (2.5 + i * 0.6) * scale;
        addWord(CX + Math.cos(angle) * r, CY + Math.sin(angle) * r, "c-heart");
    }

    // 2. البتلات الداخلية (تغلف القلب وتعطي شكل البرعم المغلق)
    for (let p = 0; p < 6; p++) {
        let baseAngle = (p / 6) * Math.PI * 2;
        for (let j = 0; j < 14; j++) {
