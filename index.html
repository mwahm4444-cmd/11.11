
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1 Rose, Every Language</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: Georgia, serif;
}

h1 {
    color: #ff3344;
    font-size: clamp(18px, 5vw, 25px);
    letter-spacing: 2px;
    text-align: center;
    text-shadow: 0 0 12px #ff1744;
    margin: 0 0 12px;
}

#canvas {
    position: relative;
    width: min(96vw, 440px);
    height: min(82vh, 570px);
}

.word {
    position: absolute;
    white-space: nowrap;
    transform: translate(-50%, -50%);
    font-size: 9px;
    opacity: 0;
    pointer-events: none;
    line-height: 1;
}

.red {
    color: #ff294e;
    text-shadow: 0 0 5px rgba(255, 30, 70, .55);
}

.green {
    color: #00dc79;
    text-shadow: 0 0 4px rgba(0, 230, 118, .5);
}
</style>
</head>

<body>

<h1>1 Rose, Every Language</h1>
<div id="canvas"></div>

<script>
const phrases = [
    "I LOVE YOU",
    "Te amo",
    "Je t'aime",
    "Ich liebe dich",
    "Te quiero",
    "أحبك",
    "Mahal kita",
    "Nakapenda",
    "S'agapo",
    "Milujem ťa",
    "Kocham Cię",
    "Seni seviyorum",
    "Я тебя люблю",
    "사랑해요",
    "我爱你"
];

const canvas = document.getElementById("canvas");

const CX = 220;
const CY = 205;

const sequence = [];

function addWord(x, y, color) {
    const el = document.createElement("div");

    el.className = "word " + color;
    el.textContent =
        phrases[Math.floor(Math.random() * phrases.length)];

    el.style.left = x + "px";
    el.style.top = y + "px";

    sequence.push(el);
}

// =====================================
// 1. ROOTS - الجذور
// =====================================

function createRoot(side) {
    const count = 22;

    for (let i = 0; i < count; i++) {
        const t = i / (count - 1);

        addWord(
            CX + side * (8 + t * 65),
            CY + 260 + t * 55,
            "green"
        );
    }
}

createRoot(-1);
createRoot(1);

// الجذر الأوسط
for (let i = 0; i < 20; i++) {
    addWord(
        CX + Math.sin(i * .13) * 3,
        CY + 250 + i * 2.5,
        "green"
    );
}

// =====================================
// 2. STEM - الساق
// =====================================

for (let i = 0; i < 32; i++) {
    const t = i / 31;

    addWord(
        CX + Math.sin(t * 2.5) * 4,
        CY + 245 - t * 145,
        "green"
    );
}

// =====================================
// 3. LEAVES - الأوراق
// =====================================

function createLeaf(side) {
    const count = 20;

    for (let i = 0; i < count; i++) {
        const t = i / (count - 1);

        const x = CX + side * t * 85;
        const y = CY + 165 - t * 42
            + Math.sin(t * Math.PI) * 15;

        addWord(x, y, "green");
    }
}

createLeaf(-1);
createLeaf(1);

// =====================================
// 4. ROSE PETALS - البتلات
// =====================================

// معادلة وردة ذات 8 بتلات
function roseRadius(angle) {
    return 102 * Math.abs(Math.cos(4 * angle));
}

// إنشاء صفوف متوازية داخل شكل الوردة
const rows = 22;
const samples = 180;

for (let row = 1; row <= rows; row++) {

    const scale = row / rows;
    const points = [];

    for (let i = 0; i < samples; i++) {

        const angle = (i / samples) * Math.PI * 2;

        const radius = roseRadius(angle) * scale;

        points.push({
            x: CX + Math.cos(angle) * radius,
            y: CY + Math.sin(angle) * radius * 0.82
        });
    }

    // ترتيب نقاط كل صف على مسار منتظم
    points.sort((a, b) => a.y - b.y);

    // تقليل عدد الكلمات للحفاظ على المسافة
    for (let i = 0; i < points.length; i += 5) {
        addWord(
            points[i].x,
            points[i].y,
            "red"
        );
    }
}

// =====================================
// 5. CENTER - قلب الوردة
// =====================================

for (let i = 0; i < 12; i++) {

    const angle = (i / 12) * Math.PI * 2;

    addWord(
        CX + Math.cos(angle) * 9,
        CY + Math.sin(angle) * 8,
        "red"
    );
}

// =====================================
// 6. ANIMATION - ظهور كلمة كلمة
// =====================================

// العناصر تُضاف بالترتيب:
// الجذور، الساق، الأوراق، البتلات، القلب

let current = 0;

function showNextWord() {

    if (current >= sequence.length) return;

    const word = sequence[current];

    canvas.appendChild(word);

    word.style.transition = "opacity 0.25s ease";
    word.style.opacity = "1";

    current++;

    setTimeout(showNextWord, 90);
}

// بدء الرسم
setTimeout(showNextWord, 700);

</script>

</body>
</html>
