<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1 Rose, Every Language</title>
    <style>
        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Georgia', serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        h1 {
            color: #ff3344;
            font-size: 1.8rem;
            margin-bottom: 5px;
            letter-spacing: 2px;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 51, 68, 0.5);
        }

        #canvas {
            position: relative;
            width: 400px;
            height: 450px;
        }

        .word {
            position: absolute;
            font-size: 10px;
            white-space: nowrap;
            user-select: none;
            transition: 0.3s;
        }

        .red { color: #ff1744; text-shadow: 0 0 4px rgba(255, 23, 68, 0.6); }
        .green { color: #00e676; text-shadow: 0 0 4px rgba(0, 230, 118, 0.6); }
    </style>
</head>
<body>

    <h1>1 Rose, Every Language</h1>
    <div id="canvas"></div>

    <script>
        const phrases = [
            "I LOVE YOU", "Te amo", "Je t'aime", "Ich liebe dich", "Te quiero",
            "أحبك", "Mahal kita", "Nakapenda", "S'agapo", "Milujem ťa",
            "Kocham Cię", "Seni seviyorum", "Я тебя люблю", "사랑해요", "我爱你"
        ];

        const canvas = document.getElementById('canvas');
        const total = 160;

        for (let i = 0; i < total; i++) {
            const el = document.createElement('div');
            el.className = 'word';
            el.innerText = phrases[Math.floor(Math.random() * phrases.length)];

            let x = 0, y = 0, isRed = true;

            if (i < 120) {
                // رسم 8 بتلات وردة هندسية
                isRed = true;
                const angle = (i / 120) * Math.PI * 2;
                // معادلة الـ 8 بتلات (Rose Curve: r = cos(4 * theta))
                const r = 90 * Math.abs(Math.cos(4 * angle)) + 20;
                
                // توزيع عشوائي خفيف داخل البتلة لتعبئتها بشكل طبيعي
                const dist = r * (0.3 + Math.random() * 0.7);
                x = Math.cos(angle) * dist;
                y = Math.sin(angle) * dist - 40; // رفع الوردة للأعلى قليلاً
            } else {
                // الساق والجذور الخضراء في الأسفل
                isRed = false;
                const stemStep = i - 120;
                y = stemStep * 3 + 45; // النزول للأسفل
                
                if (stemStep < 30) {
                    x = Math.sin(stemStep * 0.2) * 6; // الساق بخط مستقيم ومنحني بسيط
                } else {
                    // تفرع الجذور يمين ويسار في القاع
                    const side = (stemStep % 2 === 0) ? 1 : -1;
                    x = side * (stemStep - 25) * 1.2;
                    y += 10;
                }
            }

            el.classList.add(isRed ? 'red' : 'green');
            // تمركز العناصر في منتصف الـ canvas تماماً
            el.style.left = `calc(50% + ${x}px)`;
            el.style.top = `calc(50% + ${y}px)`;

            canvas.appendChild(el);
        }
    </script>
</body>
</html>
