
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1 Rose, Every Language</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #000;
    color: white;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: Georgia, serif;
}

h1 {
    color: #ff3344;
    font-size: 23px;
    text-align: center;
    text-shadow: 0 0 12px #ff1744;
    margin: 0 0 10px;
}

#canvas {
    position: relative;
    width: min(95vw, 440px);
    height: min(82vh, 570px);
}

.word {
    position: absolute;
    transform: translate(-50%, -50%);
    font-size: 9px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
}

.red {
    color: #ff1744;
    text-shadow: 0 0 5px #ff1744;
}

.green {
    color: #00e676;
    text-shadow: 0 0 5px #00e676;
}
</style>
</head>

<body>

<h1>1 Rose, Every Language</h1>
<div id="canvas"></div>

<script>
const phrases = [
    "I LOVE YOU", "Te amo", "Je t'aime",
    "Ich liebe dich", "Te quiero",
    "أحبك", "Mahal kita", "Nakapenda",
    "S'agapo", "Milujem ťa",
    "Kocham Cię", "Seni seviyorum",
    "Я тебя люблю", "사랑해요", "我爱你"
];

const canvas = document.getElementById("canvas");

const CX = 220;
const CY = 205;

const rootWords = [];
const stemWords = [];
const leafWords = [];
const petalWords = [];
const centerWords = [];

function makeWord(x, y, color) {
    const el = document.createElement("div");

    el.className = "word " + color;
    el.textContent =
        phrases[Math.floor(Math.random() * phrases.length)];

    el.style.left = x + "px";
    el.style.top = y + "px";

    return el;
}

// =================================
// ROOTS: الجذور
// =================================

for (let side of [-1, 1]) {
    for (let i = 0; i < 40; i++) {
        const t = i / 40;

        rootWords.push(
            makeWord(
                CX + side * t * 65,
                CY + 235 + t * 55,
                "green"
            )
        );
    }
}

for (let i = 0; i < 25; i++) {
    rootWords.push(
        makeWord(
            CX + Math.sin(i * 0.12) * 4,
            CY + 230 + i * 2.5,
            "green"
        )
    );
}

// =================================
// STEM: الساق من الأسفل للأعلى
// =================================

for (let i = 0; i < 75; i++) {
    const progress = i / 75;

    stemWords.push(
        makeWord(
            CX + Math.sin(i * 0.035) * 5,
            CY + 230 - progress * 135,
            "green"
        )
    );
}

// =================================
// LEAVES: الأوراق
// =================================

for (const side of [-1, 1]) {
    for (let i = 0; i < 35; i++) {
        const t = i / 35;

        leafWords.push(
            makeWord(
                CX + side * t * 95,
                CY + 170 - t * 45 +
                Math.sin(t * Math.PI) * 17,
                "green"
            )
        );
    }
}

// =================================
// PETALS: البتلات
// =================================

// رسم منحنى بتلات وردة بثمانية فصوص
for (let i = 0; i < 360; i++) {
    const angle = (i / 360) * Math.PI * 2;

    const radius = 100 * Math.abs(
        Math.cos(4 * angle)
    );

    const x = CX + Math.cos(angle) * radius;
    const y = CY + Math.sin(angle) * radius * 0.82;

    // تعبئة داخل الشكل
    const fillCount = 3;

    for (let j = 0; j < fillCount; j++) {
        const distance = Math.random();

        petalWords.push(
            makeWord(
                CX + (x - CX) * distance,
                CY + (y - CY) * distance,
                "red"
            )
        );
    }
}

// قلب الوردة
for (let i = 0; i < 35; i++) {
    const angle = Math.random() * Math.PI * 2;
    const radius = Math.random() * 19;

    centerWords.push(
        makeWord(
            CX + Math.cos(angle) * radius,
            CY + Math.sin(angle) * radius,
            "red"
        )
    );
}

// =================================
// ANIMATION: ظهور كلمة كلمة
// =================================

async function showGroup(group, delay) {
    for (const word of group) {
        canvas.appendChild(word);

        word.style.transition = "opacity 0.35s ease";
        word.style.opacity = "1";

        await new Promise(resolve =>
            setTimeout(resolve, delay)
        );
    }
}

async function startAnimation() {

    // الشاشة فارغة في البداية

    await new Promise(resolve =>
        setTimeout(resolve, 700)
    );

    // الجذور أولاً
    await showGroup(rootWords, 75);

    // الساق
    await showGroup(stemWords, 65);

    // الأوراق
    await showGroup(leafWords, 75);

    // البتلات
    await showGroup(petalWords, 35);

    // قلب الوردة
    await showGroup(centerWords, 65);
}

startAnimation();

</script>

</body>
</html>
