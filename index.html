
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Rose, Every Language</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #000;
}
</style>
</head>

<body>

<canvas id="rose"></canvas>

<script>
(() => {
"use strict";

const canvas = document.getElementById("rose");
const ctx = canvas.getContext("2d");

const W = 720;
const H = 1280;

const WORDS = [
"LOVE","AMOUR","AMORE","AMOR","LIEBE","愛","حب","사랑",
"愛情","TE AMO","JE T'AIME","TI AMO","EU TE AMO",
"Я ТЕБЯ ЛЮБЛЮ","我爱你","愛してる","SENI SEVIYORUM",
"MAHAL KITA","NAKUPENDA","ICH LIEBE DICH","أحبك",
"사랑해","प्यार","KÄRLEK","LJUBAV","אהבה","AMOR"
];

const REDS = [
"#ed1748",
"#d90b3e",
"#ff315b",
"#b90035",
"#e91e50",
"#c9083c",
"#f04468",
"#a90030"
];

let width, height, dpr, scale, ox, oy;
let rows = [];
let petals = [];
let started = 0;
let animation = 0;

function random(n) {
    const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
}

// Transform local petal coordinates into flower coordinates
function transformPoint(cx, cy, angle, x, y) {
    return {
        x: cx + x * Math.cos(angle) + y * Math.sin(angle),
        y: cy - x * Math.sin(angle) + y * Math.cos(angle)
    };
}

// Create a realistic broad petal
function createPetal(cx, cy, angle, length, width, offset = 0) {

    const p = new Path2D();

    const center = transformPoint(
        cx, cy, angle, 0, offset
    );

    const ox = center.x;
    const oy = center.y;

    function point(x, y) {
        return transformPoint(ox, oy, angle, x, y);
    }

    function move(x, y) {
        const a = point(x, y);
        p.moveTo(a.x, a.y);
    }

    function curve(x1,y1,x2,y2,x3,y3) {
        const a = point(x1,y1);
        const b = point(x2,y2);
        const c = point(x3,y3);

        p.bezierCurveTo(
            a.x,a.y,
            b.x,b.y,
            c.x,c.y
        );
    }

    // Rounded tip and broad curved sides
    move(-width * .24, 25);

    curve(
        -width * .90,
        -length * .24,
        -width * .76,
        -length * .79,
        0,
        -length
    );

    curve(
        width * .76,
        -length * .79,
        width * .90,
        -length * .24,
        width * .24,
        25
    );

    curve(
        width * .10,
        48,
        -width * .10,
        48,
        -width * .24,
        25
    );

    p.closePath();

    return p;
}

// Three layers of eight, seven and five petals
function createRose() {

    petals = [];

    const cx = 360;
    const cy = 570;

    // Outer layer: eight large petals
    for (let i = 0; i < 8; i++) {

        const angle =
            -Math.PI / 2 +
            i * Math.PI / 4;

        petals.push({
            path: createPetal(
                cx,
                cy,
                angle,
                215,
                88,
                0
            ),

            color: REDS[i],
            layer: 0,
            delay: .35 + i * .045
        });
    }

    // Middle layer: seven overlapping petals
    for (let i = 0; i < 7; i++) {

        const angle =
            -Math.PI / 2 +
            i * (Math.PI * 2 / 7) +
            .20;

        petals.push({
            path: createPetal(
                cx,
                cy,
                angle,
                155,
                65,
                4
            ),

            color: REDS[(i + 2) % REDS.length],
            layer: 1,
            delay: 1.55 + i * .065
        });
    }

    // Inner layer: five smaller petals
    for (let i = 0; i < 5; i++) {

        const angle =
            -Math.PI / 2 +
            i * (Math.PI * 2 / 5) +
            .35;

        petals.push({
            path: createPetal(
                cx,
                cy,
                angle,
                100,
                43,
                8
            ),

            color: REDS[(i + 4) % REDS.length],
            layer: 2,
            delay: 2.6 + i * .08
        });
    }

    // Small central petals
    for (let i = 0; i < 3; i++) {

        const angle =
            -Math.PI / 2 +
            i * (Math.PI * 2 / 3);

        petals.push({
            path: createPetal(
                cx,
                cy + 3,
                angle,
                58,
                27,
                7
            ),

            color: REDS[(i + 1) % REDS.length],
            layer: 3,
            delay: 3.5 + i * .12
        });
    }
}

// Leaves
function leafShape(side) {

    const p = new Path2D();

    p.moveTo(360,920);

    if (side < 0) {

        p.bezierCurveTo(
            319,877,
            242,850,
            151,885
        );

        p.bezierCurveTo(
            191,950,
            274,974,
            360,920
        );

    } else {

        p.bezierCurveTo(
            402,877,
            478,850,
            569,885
        );

        p.bezierCurveTo(
            529,950,
            446,974,
            360,920
        );
    }

    p.closePath();

    return p;
}

// Fill each petal with words
function addWordRows(path, options) {

    const {
        top,
        bottom,
        minX,
        maxX,
        stepY,
        fontSize,
        color,
        delay,
        seed,
        spacing = 5,
        rowDelay = .04
    } = options;

    const scanCanvas = document.createElement("canvas");

    scanCanvas.width = W;
    scanCanvas.height = H;

    const scan = scanCanvas.getContext("2d");

    for (
        let y = top, row = 0;
        y <= bottom;
        y += stepY, row++
    ) {

        let left = -1;
        let right = -1;

        for (let x = minX; x <= maxX; x += 2) {

            if (scan.isPointInPath(path,x,y)) {

                if (left < 0) left = x;

                right = x;
            }
        }

        if (left < 0) continue;

        let x = left + 2;
        let index = 0;

        const font =
            fontSize +
            (random(seed + row * 13) - .5) * 1.2;

        ctx.font =
            `${font}px Georgia, "Times New Roman", serif`;

        while (x < right - 4) {

            const n =
                seed +
                row * 997 +
                index * 31;

            const word =
                WORDS[
                    Math.floor(
                        random(n) * WORDS.length
                    )
                ];

            const wordWidth = ctx.measureText(word).width;

            if (x + wordWidth > right - 2) break;

            rows.push({

                x: x + wordWidth / 2,

                y: y + (random(n + 5) - .5) * 1.3,

                text: word,

                size: font,

                color: color,

                delay:
                    delay +
                    row * rowDelay +
                    index * .009 +
                    random(n + 9) * .06
            });

            x += wordWidth + spacing;

            index++;
        }
    }
}

// Build all words
function buildArtwork() {

    rows = [];

    createRose();

    // Words inside every individual petal
    for (let i = 0; i < petals.length; i++) {

        const petal = petals[i];

        addWordRows(petal.path, {

            top: 330,
            bottom: 810,

            minX: 125,
            maxX: 595,

            stepY: 10,

            fontSize: 11,

            color: REDS[(i + petal.layer) % REDS.length],

            delay: petal.delay,

            seed: 100 + i * 79,

            spacing: 4.5,

            rowDelay: .035
        });
    }

    // Green leaves
    addWordRows(leafShape(-1), {

        top: 865,
        bottom: 965,

        minX: 140,
        maxX: 365,

        stepY: 10,

        fontSize: 10.5,

        color: "#579b3c",

        delay: 5.8,

        seed: 311,

        spacing: 4,

        rowDelay: .035
    });

    addWordRows(leafShape(1), {

        top: 865,
        bottom: 965,

        minX: 355,
        maxX: 580,

        stepY: 10,

        fontSize: 10.5,

        color: "#579b3c",

        delay: 5.8,

        seed: 419,

        spacing: 4,

        rowDelay: .035
    });

    // Green stem
    for (
        let y = 755, i = 0;
        y <= 1205;
        y += 11, i++
    ) {

        const word =
            WORDS[
                Math.floor(
                    random(800 + i) * WORDS.length
                )
            ];

        rows.push({

            x: 360 + Math.sin(y * .014) * 3,

            y,

            text: word,

            size: 10.5,

            color: "#579b3c",

            delay:
                6.3 +
                (y - 755) * .006 +
                random(900 + i) * .06
        });
    }

    rows.sort((a,b) => a.delay - b.delay);
}

// Petal background and natural shading
function drawPetalBackground(elapsed) {

    for (const petal of petals) {

        const reveal = Math.max(
            0,
            Math.min(1,(elapsed - petal.delay) / .7)
        );

        if (reveal <= 0) continue;

        ctx.save();

        ctx.globalAlpha = reveal * .19;

        const gradient = ctx.createRadialGradient(
            360,570,12,
            360,570,230
        );

        gradient.addColorStop(0,"#ff4268");
        gradient.addColorStop(.5,petal.color);
        gradient.addColorStop(1,"#620019");

        ctx.fillStyle = gradient;

        ctx.fill(petal.path);

        ctx.restore();
    }
}

// Clear separation between overlapping petals
function drawPetalEdges(elapsed) {

    for (const petal of petals) {

        const reveal = Math.max(
            0,
            Math.min(1,(elapsed - petal.delay - .5) / .8)
        );

        if (reveal <= 0) continue;

        ctx.save();

        ctx.globalAlpha = reveal * .38;

        ctx.strokeStyle = "#71001e";
        ctx.lineWidth = 2.3;

        ctx.lineJoin = "round";

        ctx.stroke(petal.path);

        ctx.restore();
    }
}

// Central rose spiral
function drawRoseCenter(elapsed) {

    const reveal = Math.max(
        0,
        Math.min(1,(elapsed - 5) / 2)
    );

    if (reveal <= 0) return;

    ctx.save();

    ctx.globalAlpha = reveal * .6;

    ctx.strokeStyle = "#8f002a";
    ctx.lineWidth = 2.5;

    ctx.beginPath();

    ctx.moveTo(360,570);

    ctx.bezierCurveTo(
        320,540,
        330,485,
        365,470
    );

    ctx.bezierCurveTo(
        405,450,
        430,490,
        408,515
    );

    ctx.bezierCurveTo(
        390,535,
        365,520,
        375,500
    );

    ctx.bezierCurveTo(
        385,490,
        395,505,
        385,512
    );

    ctx.stroke();

    ctx.restore();
}

// Responsive display
function resize() {

    width = window.innerWidth;
    height = window.innerHeight;

    dpr = Math.min(
        window.devicePixelRatio || 1,
        2
    );

    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);

    scale = Math.min(
        width / W,
        height / H
    );

    ox = (width - W * scale) / 2;
    oy = (height - H * scale) / 2;

    ctx.setTransform(dpr,0,0,dpr,0,0);

    buildArtwork();

    started = performance.now();

    cancelAnimationFrame(animation);

    render(started);
}

// Main animation
function render(now) {

    ctx.clearRect(0,0,width,height);

    ctx.fillStyle = "#000";

    ctx.fillRect(0,0,width,height);

    const elapsed = (now - started) / 1000;

    ctx.save();

    ctx.translate(ox,oy);
    ctx.scale(scale,scale);

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    // Background petals appear gradually
    drawPetalBackground(elapsed);

    // Words form the individual petals
    for (const item of rows) {

        const alpha = Math.max(
            0,
            Math.min(1,(elapsed - item.delay) / .3)
        );

        if (alpha <= 0) continue;

        ctx.globalAlpha = alpha;

        ctx.fillStyle = item.color;

        ctx.font =
            `${item.size}px Georgia, "Times New Roman", serif`;

        ctx.fillText(
            item.text,
            item.x,
            item.y
        );
    }

    ctx.globalAlpha = 1;

    // Separate petals visually
    drawPetalEdges(elapsed);

    // Center of the rose
    drawRoseCenter(elapsed);

    ctx.restore();

    // Keep the completed rose visible
    if (elapsed < 14) {

        animation = requestAnimationFrame(render);
    }
}

window.addEventListener("resize",resize,{
    passive:true
});

resize();

})();
</script>

</body>
</html>
