<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Bouquet of Love - Every Language</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #030001;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

h1 {
    color: #ff2a5f;
    font-size: clamp(16px, 4vw, 22px);
    letter-spacing: 3px;
    text-align: center;
    text-shadow: 0 0 15px rgba(255, 42, 95, 0.8);
    margin: 0 0 10px;
    font-weight: 400;
}

#canvas {
    position: relative;
    width: 450px;
    height: 650px;
}

.word {
    position: absolute;
    white-space: nowrap;
    transform: translate(-50%, -50%);
    font-size: 9px; /* حجم واضح وغير مكتظ */
    font-weight: 700;
    opacity: 0;
    pointer-events: none;
    line-height: 1;
    user-select: none;
}

/* درجات الألوان للبتلات بتفاصيل بارزة */
.rose-core { color: #8b0000; text-shadow: 0 0 6px rgba(139, 0, 0, 0.9); }
.rose-inner { color: #ff1e4d; text-shadow: 0 0 6px rgba(255, 30, 77, 0.8); }
.rose-mid   { color: #ff4d79; text-shadow: 0 0 6px rgba(255, 77, 121, 0.8); }
.rose-outer { color: #ff80a6; text-shadow: 0 0 6px rgba(255, 128, 166, 0.7); }

/* ألوان الساق والأوراق الواضحة */
.stem-green { color: #00e676; text-shadow: 0 0 6px rgba(0, 230, 118, 0.8); }
.stem-dark  { color: #0b6623; text-shadow: 0 0 5px rgba(11, 102, 35, 0.7); }
</style>
</head>

<body>

<h1>A Bouquet of Love, Every Language</h1>
<div id="canvas"></div>

<script>
const languages = [
    "أحبك", "I LOVE YOU", "Te amo", "Je t'aime", "Ich liebe dich", 
    "Te quiero", "Mahal kita", "S'agapo", "Milujem ťa", "Kocham Cię", 
    "Seni seviyorum", "Я тебя люблю", "사랑해요", "我爱你", "Ti amo", 
    "Eu te amo", "Nakapenda", "Jeg elsker dig", "Minä rakastan sinua", 
    "Jag älskar dig", "Te dua", "Volim te", "Obicham te", "Ani ohev otah"
];

const canvas = document.getElementById("canvas");
const sequence = [];

function addWord(x, y, colorClass) {
    const el = document.createElement("div");
    el.className = "word " + colorClass;
    el.textContent = languages[Math.floor(Math.random() * languages.length)];
    el.style.left = x.toFixed(1) + "px";
    el.style.top = y.toFixed(1) + "px";
    sequence.push(el);
}

// دالة لرسم وردة مفصلة وواضحة في إحداثيات معينة
function createDetailedRose(centerX, centerY, scale = 1) {
    // 1. قلب الوردة (المركز الحلزوني الواضح)
    for (let i = 0; i < 25; i++) {
        let angle = i * 0.4;
        let r = (2 + (i * 0.5)) * scale;
        addWord(centerX + Math.cos(angle) * r, centerY + Math.sin(angle) * r, "rose-core");
    }

    // 2. بتلات داخلية مقوسة
    for (let p = 0; p < 5; p++) {
        let baseAngle = (p / 5) * Math.PI * 2;
        for (let j = 0; j < 10; j++) {
            let t = j / 9;
            let angle = baseAngle + (t - 0.5) * 0.8;
            let dist = 18 * scale;
            addWord(centerX + Math.cos(angle) * dist, centerY + Math.sin(angle) * dist, "rose-inner");
        }
    }

    // 3. بتلات وسطى (توزيع هندسي يظهر شكل الورقة بوضوح بدون تداخل مزعج)
    for (let p = 0; p < 7; p++) {
        let baseAngle = (p / 7) * Math.PI * 2 + 0.2;
        for (let j = 0; j < 14; j++) {
            let t = j / 13;
            let angle = baseAngle + (t - 0.5) * 1.0;
            let dist = (32 + Math.sin(t * Math.PI) * 10) * scale;
            addWord(centerX + Math.cos(angle) * dist, centerY + Math.sin(angle) * dist, "rose-mid");
        }
    }

    // 4. بتلات خارجية كبيرة وواضحة (تبين تفاصيل حواف الوردة)
    for (let p = 0; p < 9; p++) {
        let baseAngle = (p / 9) * Math.PI * 2;
        for (let j = 0; j < 18; j++) {
            let t = j / 17;
            let angle = baseAngle + (t - 0.5) * 1.2;
            let dist = (55 + Math.sin(t * Math.PI) * 18) * scale;
            addWord(centerX + Math.cos(angle) * dist, centerY + Math.sin(angle) * (dist * 0.9), "rose-outer");
        }
    }
}

// رسم باقة مكونة من 3 ورود متناسقة (وردة رئيسية في المنتصف ووردتين جانبيتين أصغر قليلاً)
// 1. الورود الجانبية
createDetailedRose(130, 160, 0.75);
createDetailedRose(320, 160, 0.75);

// 2. الوردة الرئيسية الكبيرة في المنتصف
createDetailedRose(225, 120, 1.15);

// 3. سيقان الباقة الملتفة والأنيقة
for (let i = 0; i < 70; i++) {
    let t = i / 70;
    // الساق الرئيسي المتجه للأسفل
    let x1 = 225 + Math.sin(t * Math.PI * 1.5) * 8;
    let y1 = 220 + (t * 320);
    addWord(x1, y1, i % 2 === 0 ? "stem-green" : "stem-dark");

    // سيقان فرعية للوردتين الجانبيتين
    if (i < 40) {
        let x2 = 130 + (t * 95);
        let y2 = 210 + (t * 110);
        let x3 = 320 - (t * 95);
        let y3 = 210 + (t * 110);
        addWord(x2, y2, "stem-green");
        addWord(x3, y3, "stem-dark");
    }
}

// 4. أوراق الشجر للباقة (بتفاصيل واضحة وبارزة)
function drawLeafCluster(startX, startY, side) {
    for (let i = 0; i < 20; i++) {
        let t = i / 19;
        let w = Math.sin(t * Math.PI) * 22;
        let x = startX + side * (t * 60);
        let y = startY + (t * 20) - w;
        addWord(x, y, "stem-green");
    }
}

drawLeafCluster(200, 320, -1);
drawLeafCluster(250, 360, 1);
drawLeafCluster(170, 270, -1);

// =====================================
// نظام التحريك والظهور التدريجي
// =====================================
let current = 0;

function showNextWord() {
    if (current >= sequence.length) return;

    let word = sequence[current];
    canvas.appendChild(word);

    word.style.transition = "opacity 0.2s ease-out";
    word.style.opacity = "1";

    current++;
    setTimeout(showNextWord, 25); // سرعة عرض متوازنة لتستمتع بمشاهدة رسم الباقة بالتفصيل
}

setTimeout(showNextWord, 400);

</script>

</body>
</html>
