
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>I LOVE YOU — 11:11</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#000;color:white;
 overflow:hidden;font-family:monospace;
}
#garden{
 display:block;width:100%;height:70vh;
 background:radial-gradient(ellipse,#100713,#020304 75%);
}
.terminal{
 height:30vh;background:#050607;
 border-top:1px solid #242424;
 padding:10px 12px;overflow:hidden;
}
.head{
 display:flex;justify-content:space-between;
 color:#888;font-size:10px;
 border-bottom:1px solid #222;
 padding-bottom:9px;
}
#lines{
 color:#b8b8c4;font-size:10px;
 line-height:1.75;padding-top:9px;
 white-space:pre-wrap;
}
.red{color:#ff627e}
.green{color:#58c77b}
.blue{color:#83aaff}
.gold{color:#e6bd83}
</style>
</head>
<body>

<canvas id="garden"></canvas>

<div class="terminal">
 <div class="head">
  <span>✿ love_garden.py</span>
  <span id="status">● GROWING</span>
 </div>
 <div id="lines"></div>
</div>

<script>
const canvas=document.getElementById("garden");
const ctx=canvas.getContext("2d");
let W,H,stars=[],start=performance.now();

function resize(){
 W=canvas.width=innerWidth*devicePixelRatio;
 H=canvas.height=innerHeight*.70*devicePixelRatio;
 canvas.style.width=innerWidth+"px";
 canvas.style.height=innerHeight*.70+"px";
 ctx.setTransform(1,0,0,1,0,0);
 stars=Array.from({length:160},()=>({
  x:Math.random()*W,y:Math.random()*H,
  r:Math.random()*1.5+.4,
  phase:Math.random()*6
 }));
}
resize();
addEventListener("resize",resize);

const phrase="I LOVE YOU";
const repeat="I LOVE YOU  ·  I LOVE YOU  ·  ";

function drawTextPetal(x,y,angle,rx,ry,layer,progress){
 ctx.save();
 ctx.translate(x,y);
 ctx.rotate(angle);

 // Petal shape
 ctx.beginPath();
 ctx.ellipse(0,-ry*.35,rx,ry,0,0,Math.PI*2);
 ctx.clip();

 const grad=ctx.createLinearGradient(-rx,-ry,rx,ry);
 grad.addColorStop(0,"#ffb0c1");
 grad.addColorStop(.35,layer===0?"#fa315c":"#e20c42");
 grad.addColorStop(.75,"#a70032");
 grad.addColorStop(1,"#470016");
 ctx.fillStyle=grad;
 ctx.fillRect(-rx-5,-ry-5,rx*2+10,ry*2+10);

 // Words form the petal
 ctx.font="bold 8px monospace";
 ctx.textAlign="center";
 ctx.fillStyle="rgba(255,220,230,.83)";

 for(let yy=-ry*1.2;yy<ry;yy+=9){
  ctx.fillText(repeat,0,yy);
 }

 ctx.restore();
}

function drawFlower(x,y,size,progress){
 if(progress<=0)return;

 ctx.save();
 ctx.translate(x,y);
 ctx.scale(size,size);

 const layers=[
  {count:11,radius:21,rx:19,ry:40,offset:0},
  {count:9,radius:15,rx:17,ry:34,offset:.18},
  {count:7,radius:9,rx:14,ry:27,offset:.35}
 ];

 layers.forEach((layer,L)=>{
  for(let i=0;i<layer.count;i++){
   const reveal=(i/layer.count)*.3+L*.12;
   const p=Math.max(0,Math.min(1,(progress-reveal)/.65));
   if(p<=0)continue;

   const angle=i*Math.PI*2/layer.count+layer.offset;
   const px=Math.cos(angle)*layer.radius*p;
   const py=Math.sin(angle)*layer.radius*p;

   drawTextPetal(
    px,py,angle,
    layer.rx*p,
    layer.ry*p,
    L,p
   );
  }
 });

 // Center
 ctx.beginPath();
 ctx.arc(0,0,10*progress,0,Math.PI*2);
 ctx.fillStyle="#670b28";
 ctx.fill();

 ctx.font="bold 5px monospace";
 ctx.textAlign="center";
 ctx.fillStyle="#ffc3d1";
 ctx.fillText("LOVE",0,2);

 ctx.restore();
}

function drawLeaf(x,y,angle,size){
 ctx.save();
 ctx.translate(x,y);
 ctx.rotate(angle);
 ctx.scale(size,size);

 ctx.beginPath();
 ctx.ellipse(0,0,13,29,0,0,Math.PI*2);
 ctx.clip();

 ctx.fillStyle="#08783d";
 ctx.fillRect(-20,-35,40,70);

 ctx.font="bold 5px monospace";
 ctx.fillStyle="#b4f5bf";
 ctx.textAlign="center";

 for(let yy=-25;yy<30;yy+=7){
  ctx.fillText("I LOVE YOU",0,yy);
 }
 ctx.restore();
}

function drawStem(x,top,bottom,t){
 ctx.save();
 ctx.strokeStyle="#128349";
 ctx.lineWidth=2.5;
 ctx.beginPath();
 ctx.moveTo(x,top);
 ctx.bezierCurveTo(x-8,top+70,x+9,bottom-40,x,bottom);
 ctx.stroke();

 ctx.fillStyle="#56c87a";
 ctx.font="bold 6px monospace";
 ctx.textAlign="center";

 for(let yy=top+35;yy<bottom;yy+=13){
  ctx.fillText("I LOVE YOU",x+2,yy);
 }

 drawLeaf(x-2,top+85,-1.1,1);
 drawLeaf(x+2,top+135,1.2,.9);
 drawLeaf(x-2,top+185,-1.2,.75);
 ctx.restore();
}

function ease(t){
 return 1-Math.pow(1-t,3);
}

function render(now){
 const t=(now-start)/1000;
 ctx.clearRect(0,0,W,H);

 // Stars
 stars.forEach(s=>{
  ctx.globalAlpha=.25+.65*(.5+.5*Math.sin(t*2+s.phase));
  ctx.fillStyle="#fff";
  ctx.fillRect(s.x,s.y,s.r*devicePixelRatio,s.r*devicePixelRatio);
 });
 ctx.globalAlpha=1;

 const scale=Math.min(W/700,H/600);
 const cx=W/2;
 const flowerY=H*.39;
 const bottom=H*.91;

 ctx.save();
 ctx.translate(cx,flowerY);
 ctx.scale(scale,scale);

 // Three stems
 const positions=[
  {x:-125,size:.77,delay:2.2},
  {x:0,size:1,delay:0},
  {x:125,size:.82,delay:4.2}
 ];

 positions.forEach(f=>{
  drawStem(f.x,40,Math.min(250,(bottom-flowerY)/scale),t);
 });

 // Three roses opening one after another
 positions.forEach(f=>{
  const p=ease(Math.max(0,Math.min(1,(t-f.delay)/6)));
  drawFlower(f.x,0,f.size,p);
 });

 ctx.restore();

 // Floating love words
 if(t>5){
  ctx.font="10px monospace";
  ctx.textAlign="center";
  ctx.fillStyle="#ff9db4";
  ctx.globalAlpha=.5+.4*Math.sin(t*2);
  ctx.fillText("I LOVE YOU  ✦  I LOVE YOU",W/2,H*.12);
  ctx.globalAlpha=1;
 }

 requestAnimationFrame(render);
}
requestAnimationFrame(render);

// Animated coding window
const codeLines=[
 '<span class="blue">import</span> love_garden',
 '<span class="green"># 11:11 — a special creation</span>',
 '<span class="red">def</span> grow_love():',
 '    petals = <span class="gold">"I LOVE YOU"</span>',
 '    flowers = create_bloom(count=3)',
 '    stars = light_up_the_night()',
 '    <span class="red">return</span> forever',
 '',
 '<span class="green"># Drawing every little detail...</span>',
 'for petal in rose.petals:',
 '    petal.color = <span class="red">"deep_red"</span>',
 '    petal.open_slowly()',
 '',
 '<span class="blue">print</span>(<span class="gold">"I LOVE YOU ♥"</span>)',
 '',
 '<span class="green"># Some feelings never fade.</span>',
 'love = float("inf")',
 'heart.status = <span class="red">"always"</span>',
];

let lineIndex=0;
const box=document.getElementById("lines");

function updateCode(){
 const visible=[];
 for(let i=0;i<8;i++){
  visible.push(codeLines[(lineIndex+i)%codeLines.length]);
 }
 box.innerHTML=visible.map((line,i)=>
  `<div>${String(lineIndex+i+1).padStart(3,"0")}  ${line||"&nbsp;"}</div>`
 ).join("");
 lineIndex=(lineIndex+1)%codeLines.length;
}
updateCode();
setInterval(updateCode,1100);
</script>
</body>
</html>
