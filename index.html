
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1 Rose, Every Language</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #000;
    color: white;
    font-family: Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

h1 {
    color: #ff3344;
    font-size: clamp(20px, 5vw, 28px);
    letter-spacing: 2px;
    text-align: center;
    text-shadow: 0 0 15px #ff1744;
    margin-bottom: 10px;
}

#canvas {
    position: relative;
    width: min(95vw, 440px);
    height: min(80vh, 570px);
}

.word {
    position: absolute;
    transform: translate(-50%, -50%);
    font-size: clamp(7px, 2vw, 10px);
    white-space: nowrap;
    user-select: none;
    pointer-events: none;
}

.red {
    color: #ff1744;
    text-shadow: 0 0 5px #ff1744;
}

.green {
    color: #00e676;
    text-shadow: 0 0 5px #00e676;
}
</style>
</head>

<body>

<h1>1 Rose, Every Language</h1>
<div id="canvas"></div>

<script>
const phrases = [
    "I LOVE YOU", "Te amo", "Je t'aime",
    "Ich liebe dich", "Te quiero",
    "أحبك", "Mahal kita", "Nakapenda",
    "S'agapo", "Milujem ťa",
    "Kocham Cię", "Seni seviyorum",
    "Я тебя люблю", "사랑해요", "我爱你"
];

const canvas = document.getElementById("canvas");

const centerX = 220;
const centerY = 205;

function addWord(x, y, color, size = 10) {
    const el = document.createElement("div");

    el.className = `word ${color}`;
    el.textContent =
        phrases[Math.floor(Math.random() * phrases.length)];

    el.style.left = `${x}px`;
    el.style.top = `${y}px`;
    el.style.fontSize = `${size}px`;

    canvas.appendChild(el);
}

// رسم بتلات الوردة
const petalCount = 8;
const wordsPerPetal = 35;

for (let p = 0; p < petalCount; p++) {

    const angle = (p / petalCount) * Math.PI * 2;

    for (let i = 0; i < wordsPerPetal; i++) {

        const t = Math.random();

        // توزيع الكلمات داخل بتلات الوردة
        const radius = 100 * Math.sqrt(t);
        const spread = (Math.random() - 0.5) * 0.45;

        const a = angle + spread;

        const x = centerX + Math.cos(a) * radius;
        const y = centerY + Math.sin(a) * radius * 0.82;

        addWord(x, y, "red");
    }
}

// قلب الوردة
for (let i = 0; i < 35; i++) {
    const angle = Math.random() * Math.PI * 2;
    const radius = Math.random() * 22;

    addWord(
        centerX + Math.cos(angle) * radius,
        centerY + Math.sin(angle) * radius,
        "red"
    );
}

// الساق
for (let i = 0; i < 65; i++) {
    const y = centerY + 95 + i * 2.1;
    const x = centerX + Math.sin(i * 0.035) * 5;

    addWord(x, y, "green");
}

// الأوراق الجانبية
function addLeaf(direction) {
    for (let i = 0; i < 32; i++) {
        const t = i / 32;

        const x = centerX + direction * t * 95;
        const y = centerY + 170 - t * 45
            + Math.sin(t * Math.PI) * 17;

        addWord(x, y, "green", 9);
    }
}

addLeaf(1);
addLeaf(-1);

// الجذور الرئيسية
for (let side of [-1, 1]) {
    for (let i = 0; i < 35; i++) {
        const t = i / 35;

        const x = centerX + side * t * 65;
        const y = centerY + 235 + t * 55;

        addWord(x, y, "green", 9);
    }
}

// الجذر الأوسط
for (let i = 0; i < 22; i++) {
    addWord(
        centerX + Math.sin(i * 0.12) * 4,
        centerY + 230 + i * 2.5,
        "green",
        9
    );
}
</script>

</body>
</html>
