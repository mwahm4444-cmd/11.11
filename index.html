
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>11:11 — For You</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#020304;color:#ddd;
 font-family:monospace;overflow:hidden;
}
#scene{
 height:69vh;width:100%;display:block;
}
.info{
 position:absolute;left:6%;top:8px;
 color:#888;font-size:11px;line-height:1.7;
}
.info strong{color:#f39bad}
.editor{
 height:31vh;border-top:1px solid #333;
 background:#090b10;padding:12px 14px;
 overflow:hidden;
}
.editor-head{
 display:flex;justify-content:space-between;
 color:#999;font-size:11px;
 border-bottom:1px solid #292b33;
 padding-bottom:9px;
}
.code{
 padding-top:12px;font-size:11px;
 line-height:1.9;color:#aeb6c8;
 white-space:pre-wrap;
}
.pink{color:#df8ca9}
.green{color:#76bd86}
.blue{color:#8cb8ed}
#caption{
 position:absolute;top:12px;right:15px;
 color:#dca0b5;font-size:12px;
 letter-spacing:2px;
}
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div class="info">
 <strong>@ 11:11 — 2026</strong><br>
 BLOOMING A LITTLE WISH<br>
 FOR SOMEONE SPECIAL
</div>

<div id="caption">11 : 11 ✦</div>

<div class="editor">
 <div class="editor-head">
  <span>✿ rose.py</span>
  <span>RUNNING · 30 FPS</span>
 </div>
 <div class="code" id="code">
<span class="pink">def</span> bloom():
    <span class="green"># a little gift for you</span>
    petals = create_rose()
    stars = light_up_the_sky()
    <span class="pink">return</span> beautiful_moments
 </div>
</div>

<script>
const canvas=document.getElementById("scene");
const ctx=canvas.getContext("2d");
let W,H,stars=[],start=performance.now();

function resize(){
 W=canvas.width=innerWidth;
 H=canvas.height=innerHeight*.69;
 stars=Array.from({length:130},()=>({
  x:Math.random()*W,
  y:Math.random()*H,
  r:Math.random()*1.5+.3,
  p:Math.random()*6
 }));
}
resize();
addEventListener("resize",resize);

const art=document.createElement("canvas");
art.width=420;art.height=520;
const a=art.getContext("2d");

function drawRose(t){
 a.clearRect(0,0,420,520);
 a.save();
 const growth=Math.min(1,t/7);
 a.translate(210,280);
 a.scale(growth,growth);

 // Stem
 a.strokeStyle="#47a66b";
 a.lineWidth=7;
 a.lineCap="round";
 a.beginPath();
 a.moveTo(0,0);
 a.bezierCurveTo(-8,80,10,145,0,210);
 a.stroke();

 // Leaves
 function leaf(x,y,angle){
  a.save();
  a.translate(x,y);
  a.rotate(angle);
  a.fillStyle="#31975c";
  a.beginPath();
  a.moveTo(0,0);
  a.bezierCurveTo(-55,-55,-75,5,0,12);
  a.bezierCurveTo(40,-15,30,-35,0,0);
  a.fill();
  a.restore();
 }
 leaf(-2,105,2.8);
 leaf(2,155,.4);

 // Flower petals
 const bloom=Math.min(1,t/11);
 a.translate(0,-25);
 a.scale(.25+.75*bloom,.25+.75*bloom);

 for(let layer=0;layer<3;layer++){
  for(let i=0;i<9;i++){
   a.save();
   a.rotate(i*Math.PI*2/9+layer*.2);
   a.translate(0,-layer*5);
   let g=a.createLinearGradient(0,-65,0,0);
   g.addColorStop(0,"#ff9aaf");
   g.addColorStop(.5,layer===0?"#e72752":"#b30c36");
   g.addColorStop(1,"#51051e");
   a.fillStyle=g;
   a.beginPath();
   a.moveTo(0,0);
   a.bezierCurveTo(-55,-30,-35,-92,0,-83);
   a.bezierCurveTo(42,-92,55,-30,0,0);
   a.fill();
   a.restore();
  }
 }

 // Rose center
 a.fillStyle="#710b28";
 a.beginPath();
 a.arc(0,-35,17,0,Math.PI*2);
 a.fill();
 a.restore();
 a.restore();
}

const chars=" .:-=+*#%@";

function render(now){
 const time=(now-start)/1000;
 ctx.fillStyle="#020304";
 ctx.fillRect(0,0,W,H);

 // Stars
 for(const s of stars){
  const alpha=.25+.7*(.5+.5*Math.sin(time*2+s.p));
  ctx.globalAlpha=alpha;
  ctx.fillStyle="#e8e6ff";
  ctx.fillRect(s.x,s.y,s.r,s.r);
 }
 ctx.globalAlpha=1;

 // Rose animation
 drawRose(time);

 const scale=Math.min(W/420,H/520);
 const cw=420,ch=520;
 const data=a.getImageData(0,0,cw,ch).data;
 const step=5;
 const cell=6.2;
 const ox=(W-cw*scale)/2;
 const oy=(H-ch*scale)/2;

 ctx.save();
 ctx.translate(ox,oy);
 ctx.scale(scale,scale);
 ctx.font="6px monospace";
 ctx.textBaseline="top";

 for(let y=0;y<ch;y+=step){
  for(let x=0;x<cw;x+=step){
   const k=(y*cw+x)*4;
   const alpha=data[k+3];
   if(alpha<65)continue;

   const r=data[k],g=data[k+1],b=data[k+2];
   const brightness=(r+g+b)/3;
   const char=chars[Math.min(9,Math.floor(brightness/26))];

   ctx.fillStyle=`rgba(${r},${g},${b},${alpha/255})`;
   ctx.fillText(char,x,y);
  }
 }
 ctx.restore();
 requestAnimationFrame(render);
}

requestAnimationFrame(render);

// Reveal a personal message
setTimeout(()=>{
 document.getElementById("code").innerHTML=
 `<span class="pink">def</span> special_day():
    <span class="green"># November 11</span>
    a_rose_for_you = True
    a_wish_for_you = "Happiness"
    <span class="blue">print</span>("You are special ♡")`;
},9000);
</script>
</body>
</html>
