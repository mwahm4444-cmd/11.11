
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I LOVE YOU</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

html,body {
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020203;
}

canvas {
  display:block;
  width:100%;
  height:100%;
}
</style>
</head>

<body>
<canvas id="rose"></canvas>

<script>
const canvas = document.getElementById("rose");
const ctx = canvas.getContext("2d");

let W,H,D,stars=[];
let start = performance.now();

function resize(){
  D = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth;
  H = innerHeight;

  canvas.width = W*D;
  canvas.height = H*D;
  ctx.setTransform(D,0,0,D,0,0);

  stars = Array.from({length:130},()=>({
    x:Math.random()*W,
    y:Math.random()*H,
    r:Math.random()*1.3+.3,
    phase:Math.random()*6
  }));
}
addEventListener("resize",resize);
resize();

const phrase = "I LOVE YOU";
const phraseLong = "I LOVE YOU  ·  ";

function roundedPetalPath(w,h){
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.bezierCurveTo(-w*.35,-h*.12,-w*1.1,-h*.62,-w*.48,-h*.88);
  ctx.bezierCurveTo(-w*.15,-h*1.08,w*.45,-h*1.05,w*.62,-h*.70);
  ctx.bezierCurveTo(w*1.02,-h*.35,w*.35,-h*.10,0,0);
  ctx.closePath();
}

function petal(x,y,angle,w,h,progress,color,seed){
  if(progress<=0)return;

  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(angle);
  ctx.scale(progress,progress);

  roundedPetalPath(w,h);

  const gradient=ctx.createLinearGradient(-w,-h,w,0);
  gradient.addColorStop(0,"#68051d");
  gradient.addColorStop(.25,color);
  gradient.addColorStop(.55,"#ff789c");
  gradient.addColorStop(.82,"#c31647");
  gradient.addColorStop(1,"#500018");

  ctx.fillStyle=gradient;
  ctx.shadowColor="#fa174d";
  ctx.shadowBlur=8;
  ctx.fill();

  ctx.shadowBlur=0;

  // Repeated words inside the actual petal
  ctx.save();
  roundedPetalPath(w,h);
  ctx.clip();

  ctx.font="bold 7px monospace";
  ctx.textAlign="center";
  ctx.fillStyle="rgba(255,221,231,.82)";

  for(let row=0;row<12;row++){
    const yy=-h+row*9;
    const offset=(row%2)*18;

    for(let xx=-w*1.5;xx<w*1.5;xx+=68){
      ctx.fillText(phraseLong,xx+offset,yy);
    }
  }
  ctx.restore();

  // Petal central vein
  ctx.beginPath();
  ctx.moveTo(0,-3);
  ctx.quadraticCurveTo(-w*.15,-h*.4,w*.04,-h*.82);
  ctx.strokeStyle="rgba(255,189,205,.35)";
  ctx.lineWidth=.7;
  ctx.stroke();

  ctx.restore();
}

function drawFlower(cx,cy,t){
  const outer = [
    {n:9,w:35,h:100,dist:25,delay:0},
    {n:8,w:31,h:85,dist:16,delay:1.2},
    {n:7,w:25,h:67,dist:8,delay:2.3},
    {n:6,w:19,h:48,dist:3,delay:3.2}
  ];

  // Back petals first
  outer.forEach((layer,L)=>{
    for(let i=0;i<layer.n;i++){
      const delay=layer.delay+i*.12;
      const p=ease((t-delay)/5);

      if(p<=0)continue;

      const angle=(i/layer.n)*Math.PI*2+
                  L*.31+Math.PI/2;

      const distance=layer.dist*p;
      const x=cx+Math.cos(angle)*distance;
      const y=cy+Math.sin(angle)*distance;

      petal(
        x,y,angle,
        layer.w,layer.h,
        p,
        L%2===0?"#e72a55":"#ba123c",
        i
      );
    }
  });

  // Inner curled petals
  for(let i=0;i<5;i++){
    const p=ease((t-4-i*.35)/4);
    if(p<=0)continue;

    const angle=i*Math.PI*2/5+t*.035;
    const x=cx+Math.cos(angle)*8*p;
    const y=cy+Math.sin(angle)*8*p;

    petal(x,y,angle,15,36,p,"#ed456b",i);
  }

  // Rose spiral center
  const center=ease((t-5)/4);

  if(center>0){
    ctx.save();
    ctx.translate(cx,cy);

    ctx.beginPath();
    for(let i=0;i<180;i++){
      const a=i*.12;
      const r=.3+i*.052;
      const x=Math.cos(a)*r;
      const y=Math.sin(a)*r*.83;

      if(i===0)ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
    }

    ctx.strokeStyle="#ffb0c4";
    ctx.lineWidth=2;
    ctx.shadowColor="#ff174d";
    ctx.shadowBlur=13;
    ctx.stroke();

    ctx.restore();
  }
}

function ease(v){
  v=Math.max(0,Math.min(1,v));
  return v*v*(3-2*v);
}

function leaf(x,y,angle,scale){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(angle);
  ctx.scale(scale,scale);

  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.bezierCurveTo(-20,-38,-90,-45,-76,-5);
  ctx.bezierCurveTo(-62,25,-22,24,0,0);

  const g=ctx.createLinearGradient(-70,-30,0,15);
  g.addColorStop(0,"#164d2a");
  g.addColorStop(.5,"#42aa60");
  g.addColorStop(1,"#0c3a20");

  ctx.fillStyle=g;
  ctx.shadowColor="#174f2c";
  ctx.shadowBlur=10;
  ctx.fill();

  ctx.shadowBlur=0;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.bezierCurveTo(-25,-12,-48,-13,-70,-8);
  ctx.clip();

  ctx.font="bold 7px monospace";
  ctx.textAlign="center";
  ctx.fillStyle="#c0edbd";

  for(let i=0;i<5;i++){
    ctx.fillText(phrase,-40,-22+i*9);
  }
  ctx.restore();

  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.quadraticCurveTo(-35,-12,-69,-9);
  ctx.strokeStyle="#9bdda0";
  ctx.lineWidth=1;
  ctx.stroke();

  ctx.restore();
}

function drawStem(cx,top,bottom,t){
  const p=ease(t/4);
  if(p<=0)return;

  const end=top+(bottom-top)*p;

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(cx,top);
  ctx.bezierCurveTo(cx-8,top+100,cx+13,bottom-100,end);
  ctx.strokeStyle="#21864b";
  ctx.lineWidth=5;
  ctx.lineCap="round";
  ctx.stroke();

  ctx.font="bold 8px monospace";
  ctx.textAlign="center";
  ctx.fillStyle="#8bd99c";

  for(let y=top+30;y<end;y+=13){
    ctx.fillText(phrase,cx+2,y);
  }

  ctx.restore();

  if(t>2){
    const lp=ease((t-2)/3);
    leaf(cx-3,top+115,2.7,lp);
    leaf(cx+3,top+185,.45,lp);
    leaf(cx-3,top+260,2.8,lp*.8);
  }
}

function drawStars(t){
  stars.forEach(s=>{
    const alpha=.15+.75*(.5+.5*Math.sin(t*1.5+s.phase));
    ctx.globalAlpha=alpha;
    ctx.fillStyle="#fff";
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha=1;
}

function render(now){
  const t=(now-start)/1000;

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle="#020203";
  ctx.fillRect(0,0,W,H);

  drawStars(t);

  const size=Math.min(W/390,H/740,1.25);
  const cx=W/2;
  const cy=H*.38;

  ctx.save();
  ctx.translate(cx,cy);
  ctx.scale(size,size);

  drawStem(0,95,360,t);

  drawFlower(0,0,t);

  ctx.restore();

  requestAnimationFrame(render);
}

requestAnimationFrame(render);
</script>
</body>
</html>
